<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>X System — Control Room</title>
<style>
:root{
  /* ── BG: 3-layer + elevated ── */
  --bg-void:#07080c;       /* L0: header/nav — 가장 어둡다 */
  --bg-deep:#0c0d13;       /* L1: content area — void보다 확실히 밝다 */
  --bg-surface:#181922;    /* L2: cards/blocks — deep과 delta 12 */
  --bg-raised:#232430;     /* L3: hover/track/elevated — surface와 delta 11 */

  /* ── BORDER ── */
  --border-subtle:rgba(255,255,255,.04);
  --border-normal:rgba(255,255,255,.07);
  --border-accent:rgba(129,140,248,.25);

  /* ── SEMANTIC COLORS (1색 1의미) ── */
  --green:#2dd4bf;--green-dim:rgba(45,212,191,.14);       /* healthy/ok/published */
  --amber:#f59e0b;--amber-dim:rgba(245,158,11,.14);       /* warning/pending */
  --red:#ef4444;--red-dim:rgba(239,68,68,.14);             /* critical/blocked */
  --indigo:#818cf8;--indigo-dim:rgba(129,140,248,.14);     /* active/working */
  --purple:#c084fc;--purple-dim:rgba(192,132,252,.14);     /* business */
  --cyan:#22d3ee;                                           /* accent only */

  /* ── TEXT ── */
  --text-pri:rgba(255,255,255,.93);   /* numbers, titles */
  --text-sec:rgba(255,255,255,.50);   /* descriptions, sub */
  --text-mut:rgba(255,255,255,.20);   /* disabled, empty, dim labels */
  --text-acc:#a5b4fc;                 /* brand accent */

  /* ── TYPOGRAPHY ── */
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif;
  --mono:'SF Mono','Menlo','Courier New',monospace;
  --fs-hero:32px;  --fw-hero:800;    /* Pulse headline only */
  --fs-h1:24px;    --fw-h1:700;      /* KPI numbers (scores) */
  --fs-h2:20px;    --fw-h2:700;      /* metric numbers (queue, agent count) */
  --fs-body:14px;  --fw-body:400;    /* content text */
  --fs-label:10px; --fw-label:600;   /* section headers — uppercase */
  --fs-meta:9px;                      /* timestamps, providers, micro labels */

  /* ── SPACING (4px grid) ── */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;

  /* ── RADIUS ── */
  --r-sm:4px;--r-md:6px;--r-lg:10px;

  /* ── LAYOUT ── */
  --nav-h:52px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;height:100dvh;background:var(--bg-void);color:var(--text-pri);
  font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;overflow:hidden}

/* ── TOPBAR ── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;
  height:calc(44px + var(--safe-t));padding-top:var(--safe-t);
  display:flex;align-items:center;justify-content:space-between;
  padding-left:var(--sp-4);padding-right:var(--sp-3);
  background:rgba(7,8,12,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-subtle)}
.topbar-brand{display:flex;align-items:center;gap:6px}
.topbar-ico{font-size:16px;line-height:1}
.topbar-badge{font-size:var(--fs-meta);letter-spacing:1.5px;color:var(--text-acc);
  background:var(--indigo-dim);border-radius:var(--r-sm);padding:2px 6px;font-weight:var(--fw-label)}
.topbar-right{display:flex;align-items:center;gap:6px}
.topbar-sync{font-size:var(--fs-meta);color:var(--text-sec);font-family:var(--mono)}
.topbar-time{font-size:var(--fs-label);color:var(--text-sec);font-family:var(--mono)}
.topbar-refresh{background:none;border:none;color:var(--text-mut);
  font-size:16px;cursor:pointer;padding:6px;border-radius:var(--r-sm);
  -webkit-tap-highlight-color:transparent}
.topbar-refresh:active{color:var(--indigo)}

/* ── MAIN CONTENT ── */
.main{position:fixed;top:calc(44px + var(--safe-t));left:0;right:0;
  bottom:calc(var(--nav-h) + var(--safe-b));overflow-y:auto;
  -webkit-overflow-scrolling:touch;background:var(--bg-deep)}
.tab-pane{display:none;padding:var(--sp-3) var(--sp-4) var(--sp-4)}
.tab-pane.active{display:block;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  display:flex;background:rgba(7,8,12,.97);backdrop-filter:blur(16px);
  border-top:1px solid var(--border-subtle)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;min-height:44px;background:none;border:none;
  color:var(--text-mut);font-size:var(--fs-meta);letter-spacing:.3px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:color .15s}
.nav-btn.active{color:var(--text-pri);position:relative}
.nav-btn.active::before{content:'';position:absolute;top:0;left:30%;right:30%;
  height:2px;background:var(--indigo);border-radius:0 0 1px 1px}
.nav-btn .nav-icon{font-size:18px;line-height:1}

/* ── SHARED ── */
.sub{font-size:11px;color:var(--text-sec);font-family:var(--mono)}

/* ── STATUS DOTS ── */
.dots{display:flex;gap:var(--sp-2)}
.dot{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-sec)}
.dot-led{width:6px;height:6px;border-radius:50%;background:var(--text-mut)}
.dot-led.ok{background:var(--green);box-shadow:0 0 5px var(--green)}
.dot-led.err{background:var(--red);box-shadow:0 0 5px var(--red);
  animation:blink 1.5s ease-in-out infinite}
.dot-led.warn{background:var(--amber);box-shadow:0 0 6px var(--amber)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── SCORE BLOCK ── */
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.score-box{padding:8px 10px;border-radius:var(--r-md);background:var(--bg-surface);
  border-bottom:2px solid var(--bg-raised)}
.score-num{font-size:20px;font-weight:700;line-height:1;margin-bottom:2px}
.score-label{font-size:11px;color:var(--text-sec)}
.sc-bar{height:4px;border-radius:2px;background:var(--bg-raised);margin-top:5px;overflow:hidden}
.sc-fill{height:100%;border-radius:1px;transition:width .6s ease-out}

/* ── QUEUE BADGE ── */
.badge{display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:20px;border-radius:10px;font-size:11px;font-weight:700;
  padding:0 6px}
.badge-red{background:var(--red-dim);color:var(--red)}
.badge-amber{background:var(--amber-dim);color:var(--amber)}
.badge-green{background:var(--green-dim);color:var(--green)}
.badge-blue{background:var(--indigo-dim);color:var(--indigo)}

/* ── MINI LIST ── */
.mini-list{list-style:none}
.mini-item{display:flex;align-items:center;gap:8px;padding:8px 0;
  border-bottom:1px solid var(--border-subtle);font-size:12px}
.mini-item:last-child{border-bottom:none}
.mini-item-time{font-size:10px;color:var(--text-mut);font-family:var(--mono);
  white-space:nowrap}

/* ── AGENT ROWS ── */
.ag-sum{font-size:11px;color:var(--text-sec);margin-bottom:8px}
.ag-sum b{font-weight:700}
.ag-sum .ag-s-act{color:var(--indigo)}
.agent-list{display:flex;flex-direction:column;gap:4px}
.ag-row{display:flex;flex-wrap:wrap;align-items:center;column-gap:10px;row-gap:3px;
  padding:10px 12px;background:var(--bg-surface);border-radius:var(--r-md);
  border:1px solid var(--border-subtle);border-left:3px solid transparent}
.ag-row.working{border-left-color:var(--indigo)}
.ag-row.blocked{border-left-color:var(--red)}
.ag-row.idle-row{opacity:.85}
.ag-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ag-dot.idle{background:var(--text-mut)}
.ag-dot.working{background:var(--indigo);box-shadow:0 0 6px rgba(129,140,248,.4)}
.ag-dot.blocked{background:var(--red)}
.ag-dot.manual{background:var(--text-mut);opacity:.4}
.ag-info{flex:1;min-width:0}
.ag-name{font-size:12px;font-weight:600}
.ag-prov{font-size:8px;color:var(--text-mut)}
.ag-note{flex-basis:100%;font-size:8px;color:var(--text-mut);
  padding-left:18px;margin-top:-1px}
.ag-runs{text-align:right}
.ag-count{font-size:18px;font-weight:700;line-height:1}
.ag-label{font-size:7px;text-transform:uppercase;letter-spacing:.5px}
.ag-bar{flex-basis:100%;height:2px;border-radius:1px;background:var(--bg-raised);overflow:hidden}
.ag-bar-fill{height:100%;border-radius:1px;
  background:linear-gradient(90deg,var(--indigo),var(--cyan),var(--indigo));
  background-size:200% 100%;animation:shimmer 2.5s linear infinite}
.prov-strip{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.prov-tag{display:flex;align-items:center;gap:3px;font-size:9px;color:var(--text-sec)}
.prov-led{width:5px;height:5px;border-radius:50%}
.prov-led.on{background:var(--green)}.prov-led.off{background:var(--text-mut)}

/* ── AGENT ICON → CSS AVATAR ── */
.ag-av{width:28px;height:28px;border-radius:var(--r-md);display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;color:var(--bg-void)}
.ag-row.working .ag-av{animation:ag-bounce 2s ease-in-out infinite;
  box-shadow:0 0 8px rgba(129,140,248,.3)}
.ag-row.idle-row .ag-av{opacity:.35}

/* ── WORKING MOTION ── */
@keyframes ag-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes ag-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes breathe{0%,100%{box-shadow:0 0 4px currentColor}50%{box-shadow:0 0 10px currentColor}}
@keyframes slideIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
@keyframes scan{from{left:-40px}to{left:100%}}
.ag-dot.working{animation:ag-pulse 2s ease-in-out infinite}
.ag-dot.blocked{animation:blink 1.5s ease-in-out infinite}
.dot-led.ok{animation:breathe 3s ease-in-out infinite}
.score-num{transition:color .3s}
.q-num{transition:color .3s}
.news-row{animation:slideIn .3s ease-out both}
.draft-row{animation:slideIn .3s ease-out both}

/* ── NAVER SCAN ── */
.naver-row{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:10px;
  background:var(--bg-surface);border-radius:var(--r-md);position:relative;overflow:hidden}
.naver-row::after{content:'';position:absolute;top:0;bottom:0;width:40px;
  background:linear-gradient(90deg,transparent,rgba(45,212,191,.08),transparent);
  animation:scan 3s linear infinite}

/* ── SYSTEM DIAGNOSTIC ── */
.sys-diag{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-bottom:var(--sp-2)}
.diag-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;
  background:var(--bg-surface)}

/* ── SECTION HEADER ── */
.sec-head{font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:1.5px;
  color:var(--text-mut);margin:var(--sp-4) 0 var(--sp-1);text-transform:uppercase}
.sec-head:first-child,.sec-head.first{margin-top:0}

/* ── OPS ── */
.ops-health{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-3);
  padding:var(--sp-2) var(--sp-3);background:var(--bg-surface);border-radius:var(--r-md);
  border-top:2px solid var(--green)}
.ops-h-item{display:flex;align-items:center;gap:3px;font-size:var(--fs-meta);color:var(--text-sec)}
.ops-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-1);margin-bottom:var(--sp-3)}
.ops-item{background:var(--bg-surface);border-radius:var(--r-md);padding:10px var(--sp-3);
  border-left:2px solid transparent}
.ops-item.has-data{border-left-color:var(--green)}
.ops-val{font-size:var(--fs-h1);font-weight:var(--fw-h1)}
.ops-label{font-size:var(--fs-meta);color:var(--text-mut);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.biz-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--sp-1);margin-bottom:var(--sp-3)}
.biz-cell{background:var(--bg-surface);border-radius:var(--r-md);padding:var(--sp-2);
  text-align:center;border-bottom:2px solid var(--purple-dim)}
.biz-num{font-size:var(--fs-h2);font-weight:var(--fw-h2);line-height:1}
.biz-lbl{font-size:var(--fs-meta);color:var(--text-mut);margin-top:3px;text-transform:uppercase}
.ops-q{background:var(--bg-surface);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);
  border-left:2px solid var(--amber)}
.ops-q-row{display:flex;justify-content:space-between;align-items:center;
  padding:3px 0;font-size:var(--fs-body);color:var(--text-sec)}
.ops-q-row span:last-child{font-weight:600;color:var(--text-pri);font-family:var(--mono);font-size:11px}

/* ── PULSE: STATUS RAIL ── */
.status-rail{display:flex;align-items:center;justify-content:space-between;
  padding:6px var(--sp-3);margin-bottom:var(--sp-2);
  background:var(--bg-surface);border-radius:var(--r-md)}
.pulse-hl{font-size:30px;font-weight:800;line-height:1.15;
  margin-bottom:4px;letter-spacing:-.5px}
.pulse-hl small{display:block;font-size:14px;font-weight:400;color:var(--text-sec);
  margin-top:4px;letter-spacing:0}

/* ── PULSE: ACTION CARDS ── */
.act-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:var(--sp-3) 0}
.act-card{background:var(--bg-surface);border-radius:var(--r-md);
  padding:12px 8px;text-align:center}
.act-num{font-size:26px;font-weight:800;line-height:1}
.act-lbl{font-size:12px;color:var(--text-sec);margin-top:4px}

/* ── PULSE: QUEUE GRID ── */
.q-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.q-cell{background:var(--bg-surface);border-radius:var(--r-md);padding:8px 4px;
  text-align:center}
.q-cell.dim{opacity:.3}
.q-cell:not(.dim){background:var(--bg-raised)}
.q-num{font-size:18px;font-weight:700;line-height:1}
.q-lbl{font-size:10px;color:var(--text-sec);margin-top:2px}

/* ── ALERTS: NAVER ROW ── */
.naver-tag{font-size:8px;font-weight:600;color:var(--text-mut);letter-spacing:1px;text-transform:uppercase}
.naver-pct{font-size:13px;font-weight:700;min-width:28px}
.naver-track{flex:1;height:2px;border-radius:1px;background:var(--bg-raised);overflow:hidden}
.naver-fill{height:100%;border-radius:1px;background:var(--green);transition:width .3s}
.naver-rem{font-size:8px;color:var(--text-mut);white-space:nowrap}

/* ── ALERTS: ITEM ── */
.alert-item{background:var(--bg-surface);border-radius:var(--r-md);padding:8px 12px;
  margin-bottom:4px;border-left:3px solid var(--red)}
.alert-snap{font-size:11px;margin-bottom:3px;line-height:1.3;color:var(--text-pri);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-meta{display:flex;gap:4px;align-items:center}

/* ── ALERTS: NEWS FEED ── */
.news-feed{border-left:2px solid var(--border-normal);padding-left:var(--sp-2)}
.news-row{display:flex;align-items:flex-start;gap:6px;padding:6px 0;
  border-bottom:1px solid var(--border-subtle);min-height:34px}
.news-row:last-child{border-bottom:none}
.news-dot{width:4px;height:4px;border-radius:50%;background:var(--text-mut);
  flex-shrink:0;margin-top:5px}
.news-title{flex:1;font-size:13px;color:var(--text-pri);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── PIPELINE ── */
.pi-sum{font-size:11px;color:var(--text-sec);margin-bottom:8px}
.pi-sum b{font-weight:700}
.stage-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-bottom:10px;
  position:relative}
.stage-grid::before{content:'';position:absolute;top:50%;left:6%;right:6%;
  height:1px;background:linear-gradient(90deg,transparent,var(--indigo-dim),var(--green-dim),transparent);
  background-size:200% 100%;animation:shimmer 4s linear infinite;transform:translateY(-50%)}
.stage-cell{text-align:center;padding:7px 2px;background:var(--bg-surface);
  border-radius:var(--r-md);position:relative;z-index:1}
.stage-cell.empty-stage{opacity:.25}
.stage-num{font-size:16px;font-weight:700;line-height:1}
.stage-lbl{font-size:7px;color:var(--text-mut);margin-top:2px;letter-spacing:.3px;text-transform:uppercase}

/* ── PIPELINE: DRAFT ROW ── */
.draft-row{padding:6px 0;border-bottom:1px solid var(--border-subtle)}
.draft-row:last-child{border-bottom:none}
.draft-top{display:flex;align-items:center;gap:6px}
.draft-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.draft-hook{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.draft-bot{display:flex;align-items:center;gap:4px;margin-top:3px;padding-left:12px}
.draft-chip{font-size:7px;font-weight:600;padding:1px 4px;border-radius:var(--r-sm);
  text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.draft-risk{font-size:7px;font-weight:600;padding:1px 4px;border-radius:var(--r-sm);white-space:nowrap}
.draft-time{font-size:8px;color:var(--text-mut);font-family:var(--mono);white-space:nowrap}
.draft-acts{display:flex;gap:3px;flex-shrink:0}
.draft-btn{background:var(--bg-raised);border:none;color:var(--text-sec);font-size:11px;
  font-weight:600;padding:6px 12px;border-radius:var(--r-md);cursor:pointer;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;min-height:32px}
.draft-btn:active{background:var(--indigo-dim);color:var(--indigo)}
.draft-btn.sent{background:var(--green-dim);color:var(--green);pointer-events:none}
.draft-btn.fail{background:var(--red-dim);color:var(--red)}
.draft-btn.sending{opacity:.5;pointer-events:none}

/* ── PIPE TAB SWITCH ── */
.pipe-tab{background:var(--bg-surface);border:none;color:var(--text-mut);
  font-size:13px;font-weight:600;padding:8px 16px;border-radius:var(--r-md);
  cursor:pointer;-webkit-tap-highlight-color:transparent;flex:1;text-align:center}
.pipe-tab.active{background:var(--indigo-dim);color:var(--indigo)}

/* ── CANDIDATE ROW ── */
.cand-row{padding:8px 0;border-bottom:1px solid var(--border-subtle)}
.cand-row:last-child{border-bottom:none}
.cand-top{display:flex;align-items:center;gap:6px}
.cand-score{min-width:28px;font-size:13px;font-weight:700;text-align:center;
  padding:2px 4px;border-radius:var(--r-sm)}
.cand-title{flex:1;font-size:13px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cand-bot{display:flex;align-items:center;gap:4px;margin-top:4px;padding-left:34px}
.cand-meta{font-size:10px;color:var(--text-sec)}

/* ── TAB FOOTER ── */
.tab-footer{margin-top:var(--sp-4);padding:var(--sp-2) var(--sp-3);
  font-size:var(--fs-meta);color:var(--text-mut);font-family:var(--mono);
  text-align:center;background:var(--bg-surface);border-radius:var(--r-md)}

/* ── COMPACT EMPTY ── */
.empty-sm{padding:var(--sp-2) var(--sp-3);text-align:center;font-size:var(--fs-label);
  color:var(--text-mut);background:var(--bg-surface);border-radius:var(--r-md)}

/* ── REDUCED MOTION ── */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{
  animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-brand">
    <span class="topbar-ico">🦊</span>
    <span class="topbar-badge">CONTROL ROOM</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-sync" id="headerSync"></span>
    <span class="topbar-time" id="clock"></span>
    <button class="topbar-refresh" id="refreshBtn" onclick="loadAll()">↻</button>
  </div>
</header>

<!-- MAIN -->
<div class="main">

<!-- ═══ PULSE TAB ═══ -->
<section class="tab-pane active" id="tab-pulse">

<script>
const API=window.location.origin;

// ── TAB SWITCHING ──
document.querySelectorAll('.nav-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-'+b.dataset.tab).classList.add('active');
  });
});

// ── CLOCK ──
function tick(){
  const el=document.getElementById('clock');
  if(el)el.textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Asia/Seoul'})+' KST';
}
setInterval(tick,1000);tick();

// ── DATA LOADERS ──
async function loadStatus(){
  try{
    const r=await fetch(API+'/control/status');
    const d=await r.json();
    const h=d.health||{};
    setLed('dot-db',h.db_ok);setLed('dot-tg',h.telegram_configured);setLed('dot-x',h.x_configured);
    setLed('dot-mock',!h.mock_mode);
    _hl.dbOk=!!h.db_ok;_hl.tg=!!h.telegram_configured;_hl.mock=!!h.mock_mode;updateHL();
    // system diagnostic
    const sd=document.getElementById('sysDiag');
    if(sd){
      const dg=[];
      if(!h.db_ok)dg.push({t:'DB 끊김',c:'var(--red)'});
      if(!h.telegram_configured)dg.push({t:'텔레그램 미연결',c:'var(--red)'});
      if(h.mock_mode)dg.push({t:'MOCK 모드',c:'var(--amber)'});
      if(dg.length===0)dg.push({t:'전체 정상',c:'var(--green)'});
      sd.innerHTML=dg.map(d=>`<span class="diag-tag" style="color:${d.c};border:1px solid ${d.c}">${d.t}</span>`).join('');
    }
    document.getElementById('syncTime').textContent=d.generated_at_kst||'—';
    const hs=document.getElementById('headerSync');
    if(hs)hs.textContent='sync '+(d.generated_at_kst||'').substring(11,16);

    // queue + activity → ops
    const q=d.queue||{};
    const a=d.activity||{};
    const idleC=a.is_idle?'var(--amber)':'var(--green)';
    const idleT=a.is_idle?`유휴 ${a.hours_idle||0}h`:'활성';
    document.getElementById('queueStatus').innerHTML=
      `<div class="ops-q-row"><span>Post 대기</span><span>${q.pending_count||0}</span></div>`+
      `<div class="ops-q-row"><span>Post 전체</span><span>${q.total_count||0}</span></div>`+
      `<div class="ops-q-row"><span>활동</span><span style="color:${idleC}">${idleT}</span></div>`;
    if(a.is_idle)document.getElementById('syncTime').style.color='var(--amber)';

    // news monitor
    const n=d.news||{};
    document.getElementById('fSource').textContent=n.pending_articles||0;
    const pb=document.getElementById('pulseBuf');if(pb)pb.textContent=n.overnight_buffer||0;

    // pulse footer
    const pf=document.getElementById('pulseFooter');
    if(pf){
      const nextD=new Date();nextD.setHours(nextD.getHours()+9);
      const kstH=nextD.getUTCHours();
      const toDigest=kstH<5?(5-kstH)+'시간 후':(24-kstH+5)+'시간 후';
      pf.textContent=`다음 다이제스트 ${toDigest} · 클러스터 ${n.story_clusters||0}개 · 30초 간격 수집`;
    }
    // alerts footer
    const af=document.getElementById('alertsFooter');
    if(af)af.textContent=`수집 클러스터 ${n.story_clusters||0}개 · 야간버퍼 ${n.overnight_buffer||0}건 · 알림 ${n.alerted_stories||0}건`;

    // ops footer
    const opf=document.getElementById('opsFooter');
    if(opf){
      const uptime=a.hours_idle?`마지막 활동 ${Math.round(a.hours_idle)}시간 전`:'활성 상태';
      opf.textContent=`${uptime} · 모니터 클러스터 ${n.story_clusters||0}개 · 알림 발송 ${n.alerted_stories||0}건`;
    }

    // ops health panel
    const oh=document.getElementById('opsHealth');
    if(oh){
      oh.innerHTML=[
        {l:'DB',ok:h.db_ok},{l:'TG',ok:h.telegram_configured},
        {l:'Mock',ok:!h.mock_mode,t:h.mock_mode?'ON':'OFF'},
        {l:'버퍼',ok:true,t:(n.overnight_buffer||0)},
        {l:'클러스터',ok:true,t:n.story_clusters||0},
        {l:'알림',ok:true,t:n.alerted_stories||0},
      ].map(i=>`<div class="ops-h-item"><span class="prov-led ${i.ok?'on':'off'}"></span>${i.l}${i.t!==undefined?' '+i.t:''}</div>`).join('');
    }
  }catch(e){console.warn('status:',e)}
}

async function loadEditorial(){
  try{
    const r=await fetch(API+'/control/editorial-summary');
    const d=await r.json();
    const rq=d.routing_queue||{};
    const qm={qImmediate:rq.IMMEDIATE||0,qDigest:rq.DAY_DIGEST||0,qTop10:rq.TOP10_5AM||0,qWeekly:rq.WEEKLY_POOL||0};
    Object.entries(qm).forEach(([id,v])=>{
      const el=document.getElementById(id);
      if(el){el.textContent=v;const c=el.closest('.q-cell');if(c)c.classList.toggle('dim',v===0)}
    });
    _hl.imm=rq.IMMEDIATE||0;
    _hl.ready=(rq.WEEKLY_POOL||0)+(rq.TOP10_5AM||0)+(rq.DAY_DIGEST||0);
    updateHL();updateActCards();

    const ap=d.avg_postability||0;const at=d.avg_trust||0;
    setScore('avgPost',ap);setScore('avgTrust',at);
    const ec=document.getElementById('evalCount');if(ec)ec.textContent=d.recent_eval_count||0;

    // eval counts → ops
    const evc=d.eval_counts||{};
    document.getElementById('opsEvalMeta').textContent=evc.eval_meta||0;
    document.getElementById('opsGold').textContent=evc.gold_eval||0;
    document.getElementById('opsPairwise').textContent=evc.pairwise_review||0;
    document.getElementById('opsLearning').textContent=evc.learning_record||0;
    ['opsEvalMeta','opsGold','opsPairwise','opsLearning'].forEach(id=>{
      const el=document.getElementById(id);if(!el)return;
      const v=parseInt(el.textContent)||0;
      el.style.color=v?'var(--text-pri)':'var(--text-mut)';
      el.closest('.ops-item')?.classList.toggle('has-data',v>0);
    });

    // immediate items → alerts
    const items=d.immediate_items||[];
    if(items.length){
      document.getElementById('immediateList').innerHTML=items.map(i=>
        `<div class="alert-item">
          <div class="alert-snap">${(i.post_snapshot||'').substring(0,60)}</div>
          <div class="alert-meta">
            <span class="badge badge-blue">P:${i.postability_score||0}</span>
            <span class="badge badge-green">T:${i.trust_score||0}</span>
            <span class="mini-item-time">${(i.created_at||'').substring(11,16)}</span>
          </div>
        </div>`
      ).join('');

      // pulse recent alerts
      document.getElementById('recentAlerts').innerHTML=items.slice(0,3).map(i=>
        `<li class="mini-item">
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(i.post_snapshot||'').substring(0,40)}</span>
          <span class="mini-item-time">${(i.created_at||'').substring(11,16)}</span>
        </li>`
      ).join('');
    }
  }catch(e){console.warn('editorial:',e)}
}

async function loadProviders(){
  try{
    const r=await fetch(API+'/control/providers');
    const d=await r.json();
    const roles=d.roles||[];
    const today=d.today_draft_count||0;
    const td=document.getElementById('todayDrafts')||document.getElementById('actToday');
    if(td)td.textContent=today;
    _hl.today=today;updateHL();updateActCards();

    // sort: working first, then idle, then manual
    const sorted=[...roles].sort((a,b)=>{
      const w=x=>x.runs_today>0?0:!x.configured?1:x.role==='TrendHunter'?3:2;
      return w(a)-w(b);
    });
    // summary
    const act=sorted.filter(a=>a.runs_today>0).length;
    const as=document.getElementById('agentSummary');
    if(as)as.innerHTML=`<b class="ag-s-act">${act}/${sorted.length}</b> 작동 중 · <b>${today}</b> 오늘 실행`;
    // agent rows with CSS avatars
    const avColors={DraftWriter:'var(--indigo)',Reviewer:'var(--green)',Researcher:'var(--cyan)',FactChecker:'var(--amber)',TrendHunter:'var(--purple)'};
    const avLetters={DraftWriter:'D',Reviewer:'R',Researcher:'S',FactChecker:'F',TrendHunter:'T'};
    document.getElementById('agentCards').innerHTML=sorted.map((a,i)=>{
      const working=a.runs_today>0;
      const blocked=!a.configured;
      const manual=a.role==='TrendHunter';
      let st='',dot='idle',lbl='대기',clr='var(--text-sec)',lblClr='var(--text-sec)';
      if(blocked){st='blocked';dot='blocked';lbl='차단';clr='var(--red)';lblClr='var(--red)'}
      else if(working){st='working';dot='working';lbl='작동';clr='var(--indigo)';lblClr='var(--indigo)'}
      else if(manual){dot='manual';lbl='수동';st='idle-row';clr='var(--text-mut)'}
      else{st='idle-row'}
      const avC=avColors[a.role]||'var(--indigo)';
      const avL=avLetters[a.role]||'?';
      return`<div class="ag-row ${st}" style="animation-delay:${i*60}ms">
        <span class="ag-av" style="background:${avC}">${avL}</span>
        <span class="ag-dot ${dot}"></span>
        <div class="ag-info"><div class="ag-name">${a.role}</div><div class="ag-prov">${a.provider||'—'}</div></div>
        <div class="ag-runs"><div class="ag-count" style="color:${clr}">${a.runs_today??'—'}</div><div class="ag-label" style="color:${lblClr}">${lbl}</div></div>
        ${a.note?`<div class="ag-note">${a.note}</div>`:''}
        ${working?'<div class="ag-bar"><div class="ag-bar-fill"></div></div>':''}
      </div>`;
    }).join('');

    // agents footer
    const agf=document.getElementById('agentsFooter');
    if(agf){
      const totalRuns=sorted.reduce((s,a)=>s+(a.runs_today||0),0);
      const configured=sorted.filter(a=>a.configured).length;
      agf.textContent=`${configured}/${sorted.length} 연결됨 · 총 ${totalRuns}회 실행 · ${d.mock_mode?'MOCK 모드':'LIVE 모드'}`;
    }

    // provider strip
    const provs=new Map();
    roles.forEach(a=>{const p=String(a.provider||'').replace(/\s*\(.+\)/,'');if(p&&p!=='—')provs.set(p,a.configured)});
    document.getElementById('providerSummary').innerHTML=
      Array.from(provs).map(([p,ok])=>`<div class="prov-tag"><span class="prov-led ${ok?'on':'off'}"></span>${p}</div>`).join('')+
      (d.mock_mode?'<div class="prov-tag" style="margin-left:auto;color:var(--amber)">MOCK</div>':'');

  }catch(e){console.warn('providers:',e)}
}

async function loadFlowTrace(){
  try{
    const r=await fetch(API+'/control/flow-trace?limit=20');
    const d=await r.json();
    const ct={total:d.length,pending:0,approved:0,published:0,rejected:0,failed:0};
    d.forEach(x=>{if(ct.hasOwnProperty(x.status))ct[x.status]++});

    // pipeline summary
    const ps=document.getElementById('pipeSummary');
    if(ps)ps.innerHTML=ct.total?
      `<b>${ct.total}</b> 전체 · <b style="color:var(--amber)">${ct.pending}</b> 대기 · <b style="color:var(--green)">${ct.published}</b> 발행`:
      '파이프라인 입력 대기';

    // stage grid — set numbers + colors + dim empty
    const stages=[
      {id:'fSource',v:ct.total,c:'var(--text-pri)'},
      {id:'fResearch',v:ct.approved+ct.pending,c:'var(--indigo)'},
      {id:'fDraft',v:ct.approved,c:'var(--indigo)'},
      {id:'fReview',v:ct.pending,c:'var(--amber)'},
      {id:'fPublish',v:ct.published,c:'var(--green)'},
    ];
    stages.forEach(s=>{
      const el=document.getElementById(s.id);if(!el)return;
      el.textContent=s.v;
      el.style.color=s.v?s.c:'var(--text-mut)';
      el.closest('.stage-cell')?.classList.toggle('empty-stage',s.v===0);
    });

    // draft list — dense with status chip
    const dotMap={pending:'var(--amber)',approved:'var(--green)',rejected:'var(--red)',published:'var(--indigo)',failed:'var(--text-mut)'};
    const chipMap={pending:['대기','var(--amber-dim)','var(--amber)'],approved:['승인','var(--green-dim)','var(--green)'],
      rejected:['거절','var(--red-dim)','var(--red)'],published:['발행','var(--indigo-dim)','var(--indigo)'],
      failed:['실패','var(--red-dim)','var(--red)']};
    if(d.length){
      const riskC={low:'var(--green)',medium:'var(--amber)',high:'var(--red)'};
      const riskL={low:'안전',medium:'주의',high:'위험'};
      const visible=d.filter(x=>x.status!=='rejected'&&x.status!=='failed');
      document.getElementById('draftList').innerHTML=visible.slice(0,10).map((x,i)=>{
        const ch=chipMap[x.status]||['—','transparent','var(--text-mut)'];
        const rc=riskC[x.risk_level]||'var(--text-mut)';
        const rl=riskL[x.risk_level]||x.risk_level||'—';
        const ms=x.monetization_score;
        const isPending=x.status==='pending';
        const isApproved=x.status==='approved';
        const canSend=(isPending||isApproved)&&!x.broken;
        return`<div class="draft-row" style="animation-delay:${i*40}ms">
          <div class="draft-top">
            <span class="draft-dot" style="background:${dotMap[x.status]||'var(--text-mut)'}"></span>
            <span class="draft-hook">${x.hook||'—'}</span>
            <span class="draft-chip" style="background:${ch[1]};color:${ch[2]}">${ch[0]}</span>
          </div>
          <div class="draft-bot">
            ${x.broken?'<span class="draft-risk" style="color:var(--red);border:1px solid var(--red)">AI실패</span>':''}
            <span class="draft-risk" style="color:${rc};border:1px solid ${rc}">${rl}</span>
            ${x.resonance?`<span class="draft-risk" style="color:${x.resonance>=85?'var(--green)':x.resonance>=70?'var(--amber)':'var(--red)'};border:1px solid ${x.resonance>=85?'var(--green-dim)':x.resonance>=70?'var(--amber-dim)':'var(--red-dim)'}">공명${x.resonance}</span>`:''}
            ${ms!=null?`<span class="draft-risk" style="color:var(--purple);border:1px solid var(--purple-dim)">💰${ms}</span>`:''}
            <span class="draft-time">${x.created_kst||''}</span>
            <span style="flex:1"></span>
            <div class="draft-acts">
              ${x.source_url?`<a class="draft-btn" href="${x.source_url}" target="_blank" style="text-decoration:none">원문</a>`:''}
              ${canSend?`<button class="draft-btn" onclick="sendDraft(${x.id},this)">${isPending?'승인+전송':'전송'}</button>`:''}
              ${(isPending||isApproved)?`<button class="draft-btn" style="color:var(--red)" onclick="rejectDraft(${x.id},this)">✕</button>`:''}
            </div>
          </div>
        </div>`;
      }).join('');
    }
    // pipeline footer
    const ppf=document.getElementById('pipeFooter');
    if(ppf&&ct.total){
      const rate=ct.total?Math.round((ct.approved+ct.published)/ct.total*100):0;
      ppf.textContent=`승인율 ${rate}% · 거절 ${ct.rejected}건 · 실패 ${ct.failed}건`;
    }
  }catch(e){console.warn('flow:',e)}
}

function newsImp(t){
  const l=t.toLowerCase();
  const hi=['금리','전쟁','폭락','급등','긴급','속보','비트코인','bitcoin','fed','etf','파산','계엄','환율'];
  const mi=['경제','투자','주식','유가','반도체','삼성','테슬라','코스피','나스닥','무역','관세'];
  if(hi.some(k=>l.includes(k)))return'var(--red)';
  if(mi.some(k=>l.includes(k)))return'var(--amber)';
  return'var(--text-mut)';
}
async function loadNews(){
  try{
    const r=await fetch(API+'/control/recent-news?limit=12');
    const d=await r.json();
    if(d.length){
      document.getElementById('newsList').innerHTML=d.map((n,i)=>{
        const c=newsImp(n.title||'');
        return`<div class="news-row" style="animation-delay:${i*50}ms">
          <span class="news-dot" style="background:${c};box-shadow:0 0 3px ${c}"></span>
          <span class="news-title">${n.title||'—'}</span>
          ${n.time?`<span class="draft-time">${n.time}</span>`:''}</div>`;
      }).join('');
    }
  }catch(e){console.warn('news:',e)}
}

let _pipeView='drafts';
let _liveTimer=null;
function switchPipeView(view,btn){
  _pipeView=view;
  document.querySelectorAll('.pipe-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('pipeView-drafts').style.display=view==='drafts'?'':'none';
  document.getElementById('pipeView-live').style.display=view==='live'?'':'none';
  if(view==='live'){loadLiveCandidates();_liveTimer=setInterval(loadLiveCandidates,10000)}
  else{if(_liveTimer){clearInterval(_liveTimer);_liveTimer=null}}
}
async function loadLiveCandidates(){
  try{
    const r=await fetch(API+'/control/scored-candidates?limit=20');
    const d=await r.json();
    const ll=document.getElementById('liveList');
    const lc=document.getElementById('liveCount');
    if(!ll)return;
    if(lc)lc.textContent=d.length+'건';
    if(!d.length){ll.innerHTML='<div class="empty-sm">수집된 기사 없음 · 30초 간격 수집 중</div>';return}
    const catKr={crypto:'암호화폐',economy:'경제',politics:'정치',policy:'정책',tech:'기술',world:'국제',market:'시장',stock:'주식'};
    ll.innerHTML=d.map((c,i)=>{
      const sc=c.score||0;
      const sColor=sc>=15?'var(--red)':sc>=8?'var(--amber)':'var(--text-sec)';
      const sBg=sc>=15?'var(--red-dim)':sc>=8?'var(--amber-dim)':'var(--bg-raised)';
      const cat=catKr[c.category]||c.category||'기타';
      const displayTitle=c.summary&&c.summary.length>10?c.summary:c.title;
      return`<div class="cand-row" style="animation:slideIn .2s ease-out ${i*30}ms both">
        <div class="cand-top">
          <span class="cand-score" style="color:${sColor};background:${sBg}">${sc}</span>
          <span class="cand-title">${displayTitle}</span>
        </div>
        <div class="cand-bot">
          <span class="cand-meta">${cat} · ${c.time||''}</span>
          <span style="flex:1"></span>
          ${c.url?`<a class="draft-btn" href="${c.url}" target="_blank" style="text-decoration:none">원문</a>`:''}
          <button class="draft-btn" style="color:var(--indigo)" onclick="createDraft('${encodeURIComponent(c.title)}','${encodeURIComponent(c.url||'')}','${encodeURIComponent((c.summary||c.title))}',this)">초안 생성</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){console.warn('live:',e)}
}

async function createDraft(titleEnc,urlEnc,textEnc,btn){
  const title=decodeURIComponent(titleEnc);
  const url=decodeURIComponent(urlEnc);
  const st=decodeURIComponent(textEnc);
  btn.textContent='생성 중…';btn.disabled=true;btn.style.color='var(--amber)';
  try{
    const r=await fetch(API+'/ingest',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:title,source_text:st||title,url:url||null,source_type:'news_link',language:'ko'})});
    const d=await r.json();
    if(d.draft_id||d.id){btn.textContent='✓ 생성됨';btn.style.color='var(--green)';
      setTimeout(()=>{loadFlowTrace();loadCandidates()},1500);
    }else{btn.textContent='실패';btn.style.color='var(--red)';btn.disabled=false;
      setTimeout(()=>{btn.textContent='초안 생성';btn.style.color='var(--indigo)'},2000)}
  }catch(e){btn.textContent='오류';btn.style.color='var(--red)';btn.disabled=false;
    setTimeout(()=>{btn.textContent='초안 생성';btn.style.color='var(--indigo)'},2000)}
}
async function loadNaver(){
  try{
    const r=await fetch(API+'/control/naver');
    const d=await r.json();
    const used=d.used_today||0;const limit=d.daily_limit||25000;
    const pct=limit?Math.round(used/limit*100):0;
    document.getElementById('naverPct').textContent=pct+'%';
    document.getElementById('naverBar').style.width=pct+'%';
    const rem=document.getElementById('naverRemain');
    if(rem)rem.textContent=(limit-used).toLocaleString()+'건 남음';
  }catch(e){console.warn('naver:',e)}
}

// ── HELPERS ──
function setLed(id,ok){
  const el=document.getElementById(id);
  if(el)el.className='dot-led '+(ok?'ok':'err');
}
function setScore(id,val){
  const el=document.getElementById(id);if(!el)return;
  el.textContent=val||'—';
  const c=val>=70?'var(--green)':val>=40?'var(--amber)':'var(--red)';
  el.style.color=c;
  const box=el.closest('.score-box');
  if(box)box.style.borderBottomColor=c;
  const bar=document.getElementById(id+'Bar');
  if(bar){bar.style.width=(val||0)+'%';bar.style.background=c}
}
async function rejectDraft(id,btn){
  const row=btn.closest('.draft-row');
  btn.textContent='…';btn.disabled=true;
  try{
    const r=await fetch(API+'/drafts/'+id+'/reject',{method:'POST'});
    const d=await r.json();
    if(d.success){
      if(row){row.style.opacity='0';row.style.transition='opacity .3s';
        setTimeout(()=>{row.style.display='none';loadFlowTrace()},350);}
    }else{btn.textContent='✕';btn.disabled=false}
  }catch(e){btn.textContent='✕';btn.disabled=false}
}
async function sendDraft(id,btn){
  const row=btn.closest('.draft-row');
  const allBtns=row?row.querySelectorAll('.draft-btn'):[];
  allBtns.forEach(b=>b.disabled=true);
  btn.textContent='전송 중…';btn.style.background='var(--indigo-dim)';btn.style.color='var(--indigo)';
  try{
    const r=await fetch(API+'/drafts/'+id+'/approve',{method:'POST'});
    const d=await r.json();
    if(d.success){
      btn.textContent='✓ 전송됨';btn.style.background='var(--green-dim)';btn.style.color='var(--green)';
      setTimeout(()=>loadFlowTrace(),1500);
    }else{
      btn.textContent='실패';btn.style.background='var(--red-dim)';btn.style.color='var(--red)';
      allBtns.forEach(b=>b.disabled=false);
      setTimeout(()=>{btn.textContent='재시도';btn.style.background='';btn.style.color=''},2000);
    }
  }catch(e){
    btn.textContent='오류';btn.style.background='var(--red-dim)';btn.style.color='var(--red)';
    allBtns.forEach(b=>b.disabled=false);
    setTimeout(()=>{btn.textContent='재시도';btn.style.background='';btn.style.color=''},2000);
  }
}
