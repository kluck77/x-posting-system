<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>X Control Room</title>
<style>
:root {
  --bg:#0b0d14; --surface:#141720; --surface2:#1a1e2e;
  --border:rgba(255,255,255,0.07); --txt:#e2e6f0; --txt2:#7b8299; --txt3:#4b5168;
  --accent:#4f8eff; --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
  --purple:#a855f7; --cyan:#22d3ee;
  --header-h:56px; --tab-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px;overflow:hidden}
body{height:100dvh;min-height:-webkit-fill-available}

/* Header */
.app-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding-top:env(safe-area-inset-top);
  height:calc(var(--header-h) + env(safe-area-inset-top));
  background:rgba(11,13,20,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:flex-end;justify-content:space-between;
  padding-left:16px;padding-right:16px;padding-bottom:10px;
}
.header-title{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--txt)}
.header-right{display:flex;align-items:center;gap:8px}
#last-refresh{font-size:11px;color:var(--txt3)}
#refresh-btn{
  background:var(--surface2);border:1px solid var(--border);color:var(--txt2);
  width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:opacity .15s
}
#refresh-btn.spinning{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Content area */
.content{
  position:fixed;
  top:calc(var(--header-h) + env(safe-area-inset-top));
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));
  left:0;right:0;overflow:hidden;
}
.page{
  position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:none;flex-direction:column;gap:12px;padding:12px 16px 16px;
}
.page.active{display:flex}

/* Tab bar */
.tab-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(11,13,20,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;align-items:stretch;
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;min-height:56px;background:none;border:none;cursor:pointer;
  color:var(--txt3);font-size:10px;font-weight:500;transition:color .15s;
  padding-top:8px;
}
.tab-btn .tab-icon{font-size:22px;line-height:1}
.tab-btn.active{color:var(--accent)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;overflow:hidden}
.card-title{font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:10px;letter-spacing:.2px;text-transform:uppercase}
.page-title{font-size:20px;font-weight:700;color:var(--txt);padding:4px 0 2px}

/* Alert banner */
#alert-banner{
  display:none;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);
  border-radius:12px;padding:10px 14px;color:var(--red);font-size:13px;font-weight:500;
}

/* Mascot greeting */
.greeting-card{background:linear-gradient(135deg,#141720 0%,#1a1e2e 100%);border:1px solid rgba(79,142,255,.15);border-radius:14px;padding:16px}
.greeting-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mascot-avatar{font-size:36px;line-height:1}
.greeting-text h2{font-size:16px;font-weight:700;color:var(--txt);margin-bottom:2px}
.greeting-text p{font-size:12px;color:var(--txt2)}
.greeting-stats{display:flex;gap:8px;flex-wrap:wrap}
.stat-chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--txt2)}
.stat-chip span{color:var(--txt);font-weight:600}

/* Quick stats row */
.quick-stats{display:flex;gap:8px}
.qs-chip{
  flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:10px 8px;text-align:center;
}
.qs-chip .qs-val{font-size:20px;font-weight:700;color:var(--txt);line-height:1;margin-bottom:3px}
.qs-chip .qs-lbl{font-size:10px;color:var(--txt3);font-weight:500}

/* Health rows */
.health-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
.health-row:last-child{border-bottom:none}
.health-label{font-size:14px;color:var(--txt)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-green{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot-red{background:var(--red);box-shadow:0 0 6px var(--red)}
.dot-amber{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.dot-gray{background:var(--txt3)}

/* Gauge bars */
.gauge-wrap{margin-bottom:10px}
.gauge-wrap:last-child{margin-bottom:0}
.gauge-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.gauge-label{font-size:13px;color:var(--txt2)}
.gauge-nums{font-size:12px;color:var(--txt3)}
.gauge-nums b{color:var(--txt);font-weight:600}
.gauge-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.gauge-fill{height:100%;border-radius:3px;transition:width .4s ease}
.gauge-fill.ok{background:var(--green)}
.gauge-fill.caution{background:var(--amber)}
.gauge-fill.warning{background:var(--red)}
.gauge-fill.idle{background:var(--txt3)}

/* Timeline */
.tl-item{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.tl-item:last-child{border-bottom:none}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.tl-body{flex:1;min-width:0}
.tl-hook{font-size:13px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.tl-time{font-size:11px;color:var(--txt3)}

/* Badges */
.badge{display:inline-block;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:600;letter-spacing:.2px}
.badge-published{background:rgba(34,197,94,.15);color:var(--green)}
.badge-approved{background:rgba(79,142,255,.15);color:var(--accent)}
.badge-pending{background:rgba(245,158,11,.15);color:var(--amber)}
.badge-rejected{background:rgba(239,68,68,.15);color:var(--red)}
.badge-deferred{background:rgba(123,130,153,.15);color:var(--txt2)}
.badge-failed{background:rgba(239,68,68,.2);color:var(--red)}
.badge-regenerate{background:rgba(168,85,247,.15);color:var(--purple)}
.badge-low{background:rgba(34,197,94,.1);color:var(--green)}
.badge-medium{background:rgba(245,158,11,.1);color:var(--amber)}
.badge-high{background:rgba(239,68,68,.1);color:var(--red)}

/* AI tab */
.provider-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;display:flex;align-items:center;gap:14px;
}
.prov-avatar{
  width:52px;height:52px;border-radius:14px;font-size:26px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  border:1.5px solid transparent;
}
.prov-info{flex:1;min-width:0}
.prov-role{font-size:15px;font-weight:700;color:var(--txt)}
.prov-name{font-size:12px;color:var(--txt2);margin-top:1px}
.prov-status{display:flex;align-items:center;gap:5px;margin-top:4px}
.prov-right{text-align:right;flex-shrink:0}
.prov-count{font-size:28px;font-weight:800;line-height:1}
.prov-count-lbl{font-size:11px;color:var(--txt3);margin-top:1px}
.prov-footnote{font-size:11px;color:var(--txt3);padding:6px 4px}

/* Naver card */
.naver-big{font-size:36px;font-weight:800;color:var(--txt);line-height:1;margin-bottom:4px}
.naver-sub{font-size:13px;color:var(--txt2);margin-bottom:12px}
.naver-status{font-size:13px;margin-top:8px;font-weight:500}
.naver-ok{color:var(--green)} .naver-caution{color:var(--amber)}
.naver-warning{color:var(--red)} .naver-idle{color:var(--txt3)}

/* News list */
.news-item{padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--txt);line-height:1.45}
.news-item:last-child{border-bottom:none}
.empty-state{color:var(--txt3);font-size:13px;padding:8px 0;text-align:center}

/* Pipeline */
.pipeline-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 8px}
.pipeline{display:flex;align-items:center;gap:0;min-width:max-content}
.pipe-node{display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 4px}
.pipe-circle{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;border:2px solid transparent;
}
.pipe-done{background:rgba(34,197,94,.15);border-color:var(--green);color:var(--green)}
.pipe-active{background:rgba(79,142,255,.15);border-color:var(--accent);color:var(--accent)}
.pipe-pending{background:var(--surface2);border-color:var(--border);color:var(--txt3)}
.pipe-rejected{background:rgba(239,68,68,.15);border-color:var(--red);color:var(--red)}
.pipe-deferred{background:rgba(123,130,153,.15);border-color:var(--txt2);color:var(--txt2)}
.pipe-label{font-size:9px;color:var(--txt3);font-weight:500;text-align:center;max-width:44px}
.pipe-arrow{font-size:12px;color:var(--txt3);padding:0 2px;align-self:flex-end;margin-bottom:18px}

/* Draft rows */
.draft-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.draft-row:last-child{border-bottom:none}
.draft-hook{flex:1;font-size:13px;color:var(--txt);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.draft-meta{display:flex;gap:5px;align-items:center;flex-shrink:0}
.draft-time{font-size:10px;color:var(--txt3)}

/* Ops tab */
.queue-item{padding:8px 0;border-bottom:1px solid var(--border)}
.queue-item:last-child{border-bottom:none}
.queue-text{font-size:13px;color:var(--txt);margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.queue-meta{display:flex;align-items:center;gap:6px}
.queue-time{font-size:11px;color:var(--txt3)}
.tag-notified{background:rgba(34,197,94,.1);color:var(--green);border-radius:5px;padding:1px 6px;font-size:10px;font-weight:600}
.tag-pending-notify{background:rgba(245,158,11,.1);color:var(--amber);border-radius:5px;padding:1px 6px;font-size:10px;font-weight:600}
.ops-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)}
.ops-row:last-child{border-bottom:none}
.ops-label{font-size:14px;color:var(--txt2)}
.ops-val{font-size:14px;font-weight:600;color:var(--txt)}

/* Responsive desktop */
@media(min-width:640px){
  .tab-bar{justify-content:center}
  .tab-btn{max-width:120px}
  .content{max-width:640px;left:50%;transform:translateX(-50%)}
  .app-header{justify-content:center}
  .header-inner{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-title">🛰️ Control Room</div>
  <div class="header-right">
    <span id="last-refresh">—</span>
    <button id="refresh-btn" onclick="loadAll()" aria-label="새로고침">↻</button>
  </div>
</header>

<div class="content">
  <!-- TAB 1: STATUS -->
  <div class="page active" id="page-home">
    <div id="alert-banner"></div>

    <div class="greeting-card">
      <div class="greeting-top">
        <div class="mascot-avatar">👩‍💻</div>
        <div class="greeting-text">
          <h2 id="greeting-status">시스템 정상 운영 중</h2>
          <p id="greeting-date">로딩 중…</p>
        </div>
      </div>
      <div class="greeting-stats">
        <div class="stat-chip">초안 <span id="gs-drafts">—</span></div>
        <div class="stat-chip">텔레그램 <span id="gs-tg">—</span></div>
        <div class="stat-chip">포스트 <span id="gs-posts">—</span></div>
      </div>
    </div>

    <div class="quick-stats">
      <div class="qs-chip"><div class="qs-val" id="qs-queue">—</div><div class="qs-lbl">큐 대기</div></div>
      <div class="qs-chip"><div class="qs-val" id="qs-monitor">—</div><div class="qs-lbl">모니터</div></div>
      <div class="qs-chip"><div class="qs-val" id="qs-naver">—</div><div class="qs-lbl">네이버 %</div></div>
    </div>

    <div class="card">
      <div class="card-title">시스템 헬스</div>
      <div id="health-rows"></div>
    </div>

    <div class="card">
      <div class="card-title">일일 할당량</div>
      <div id="quota-bars"></div>
    </div>

    <div class="card">
      <div class="card-title">최근 활동</div>
      <div id="home-timeline"></div>
    </div>
  </div>

  <!-- TAB 2: AI -->
  <div class="page" id="page-ai">
    <div class="page-title">AI 현황 🤖</div>
    <div id="provider-list"></div>
    <div class="prov-footnote">※ 실행 횟수는 오늘 생성된 초안 수 기준</div>
  </div>

  <!-- TAB 3: INTAKE -->
  <div class="page" id="page-intake">
    <div class="page-title">인풋 &amp; 플로우 📰</div>

    <div class="card">
      <div class="card-title">네이버 뉴스 API</div>
      <div id="naver-content"></div>
    </div>

    <div class="card">
      <div class="card-title">최근 뉴스</div>
      <div id="news-list"></div>
    </div>

    <div class="card">
      <div class="card-title">파이프라인 플로우</div>
      <div class="pipeline-scroll"><div class="pipeline" id="pipeline-flow"></div></div>
    </div>

    <div class="card">
      <div class="card-title">최근 초안</div>
      <div id="intake-drafts"></div>
    </div>
  </div>

  <!-- TAB 4: OPS -->
  <div class="page" id="page-ops">
    <div class="page-title">운영 현황 ⚙️</div>

    <div class="card">
      <div class="card-title" id="queue-card-title">큐 대기</div>
      <div id="queue-items"></div>
    </div>

    <div class="card">
      <div class="card-title">리플라이 모니터</div>
      <div id="monitor-rows"></div>
    </div>

    <div class="card">
      <div class="card-title">뉴스 모니터</div>
      <div id="news-monitor-rows"></div>
    </div>

    <div class="card">
      <div class="card-title">활동 현황</div>
      <div id="activity-rows"></div>
    </div>
  </div>
</div>

<nav class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('home')" data-tab="home">
    <span class="tab-icon">🏠</span>Status
  </button>
  <button class="tab-btn" onclick="switchTab('ai')" data-tab="ai">
    <span class="tab-icon">🤖</span>AI
  </button>
  <button class="tab-btn" onclick="switchTab('intake')" data-tab="intake">
    <span class="tab-icon">📰</span>Intake
  </button>
  <button class="tab-btn" onclick="switchTab('ops')" data-tab="ops">
    <span class="tab-icon">⚙️</span>Ops
  </button>
</nav>

<script>
'use strict';
const D = {};

function esc(s){
  if(s==null)return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function kstFmt(iso){
  if(!iso)return '—';
  try{return new Date(iso).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return iso}
}
function badge(status){
  const map={published:'published',approved:'approved',pending:'pending',rejected:'rejected',deferred:'deferred',failed:'failed',regenerate:'regenerate'};
  const cls=map[status]||'pending';
  return `<span class="badge badge-${cls}">${esc(status)}</span>`;
}
function riskBadge(risk){
  if(!risk)return '';
  return `<span class="badge badge-${esc(risk)}">${esc(risk)}</span>`;
}
function dot(ok){
  if(ok===true) return '<span class="dot dot-green"></span>';
  if(ok===false) return '<span class="dot dot-red"></span>';
  return '<span class="dot dot-gray"></span>';
}
function gaugeClass(pct){
  if(pct>=90)return 'warning';
  if(pct>=70)return 'caution';
  if(pct>0)return 'ok';
  return 'idle';
}
function gaugeBar(used,limit,label){
  const pct=limit>0?Math.min(100,Math.round(used/limit*100)):0;
  const cls=gaugeClass(pct);
  return `<div class="gauge-wrap">
    <div class="gauge-top">
      <span class="gauge-label">${esc(label)}</span>
      <span class="gauge-nums"><b>${used}</b> / ${limit}</span>
    </div>
    <div class="gauge-track"><div class="gauge-fill ${cls}" style="width:${pct}%"></div></div>
  </div>`;
}
function dotForStatus(status){
  const colors={published:'#22c55e',approved:'#4f8eff',pending:'#f59e0b',rejected:'#ef4444',deferred:'#7b8299',failed:'#ef4444',regenerate:'#a855f7'};
  return colors[status]||'#4b5168';
}

function switchTab(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelector('[data-tab="'+id+'"]').classList.add('active');
}

async function loadAll(){
  const btn=document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  const [r1,r2,r3,r4,r5]=await Promise.allSettled([
    fetch('/control/status').then(r=>r.json()),
    fetch('/control/providers').then(r=>r.json()),
    fetch('/control/flow-trace?limit=15').then(r=>r.json()),
    fetch('/control/naver').then(r=>r.json()),
    fetch('/control/recent-news?limit=8').then(r=>r.json()),
  ]);
  D.status    = r1.status==='fulfilled'?r1.value:null;
  D.providers = r2.status==='fulfilled'?r2.value:null;
  D.trace     = r3.status==='fulfilled'?r3.value:[];
  D.naver     = r4.status==='fulfilled'?r4.value:null;
  D.news      = r5.status==='fulfilled'?r5.value:[];
  renderAll();
  btn.classList.remove('spinning');
  const kst=D.status?.generated_at_kst||new Date().toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul'});
  document.getElementById('last-refresh').textContent=kst;
}

function renderAll(){renderHome();renderAI();renderIntake();renderOps();}

function renderHome(){
  const s=D.status;
  if(!s){document.getElementById('alert-banner').style.display='block';document.getElementById('alert-banner').textContent='⚠️ 상태 데이터를 불러올 수 없습니다.';return;}
  // Alert banner
  const banner=document.getElementById('alert-banner');
  const isIdle=s.activity?.is_idle;
  const dbBad=s.health?.db_ok===false;
  if(isIdle||dbBad){
    banner.style.display='block';
    banner.textContent=dbBad?'⚠️ DB 연결 오류':'⏰ 파이프라인이 48시간 이상 유휴 상태입니다';
  } else {banner.style.display='none';}

  // Greeting
  const grStatus=document.getElementById('greeting-status');
  grStatus.textContent=dbBad?'⚠️ 시스템 오류 감지':(isIdle?'⏰ 유휴 상태':'시스템 정상 운영 중');
  document.getElementById('greeting-date').textContent=s.generated_at_kst||'—';
  const u=s.usage||{};
  document.getElementById('gs-drafts').textContent=`${u.drafts?.used??'—'}/${u.drafts?.limit??'—'}`;
  document.getElementById('gs-tg').textContent=`${u.telegram?.used??'—'}/${u.telegram?.limit??'—'}`;
  document.getElementById('gs-posts').textContent=`${u.posts?.used??'—'}/${u.posts?.limit??'—'}`;

  // Quick stats
  document.getElementById('qs-queue').textContent=s.queue?.pending_count??'—';
  const paused=s.monitor?.reply_monitor_paused;
  document.getElementById('qs-monitor').textContent=paused?'⏸':'▶';
  const naverPct=D.naver?.pct_used;
  document.getElementById('qs-naver').textContent=naverPct!=null?Math.round(naverPct)+'%':'—';

  // Health
  const h=s.health||{};
  const healthItems=[
    ['DB',h.db_ok],['Telegram',h.telegram_configured],['X (Twitter)',h.x_configured],
    ['Mock Mode',h.mock_mode===false,h.mock_mode],['Auto-post',h.auto_post_enabled],
  ];
  document.getElementById('health-rows').innerHTML=healthItems.map(([lbl,ok,invert])=>{
    const d=invert!=null?(invert?'<span class="dot dot-amber"></span>':dot(true)):dot(ok);
    const valTxt=ok===true?'정상':ok===false?'미설정':'—';
    return `<div class="health-row"><span class="health-label">${esc(lbl)}</span><div style="display:flex;align-items:center;gap:6px">${d}<span style="font-size:12px;color:var(--txt2)">${valTxt}</span></div></div>`;
  }).join('');

  // Quota bars
  document.getElementById('quota-bars').innerHTML=
    gaugeBar(u.drafts?.used??0,u.drafts?.limit??10,'초안 (Drafts)')+
    gaugeBar(u.telegram?.used??0,u.telegram?.limit??50,'텔레그램 (Telegram)')+
    gaugeBar(u.posts?.used??0,u.posts?.limit??10,'포스트 (Posts)');

  // Timeline (last 6)
  const trace=(D.trace||[]).slice(0,6);
  if(!trace.length){document.getElementById('home-timeline').innerHTML='<div class="empty-state">활동 없음</div>';return;}
  document.getElementById('home-timeline').innerHTML=trace.map(t=>`
    <div class="tl-item">
      <div class="tl-dot" style="background:${dotForStatus(t.status)}"></div>
      <div class="tl-body">
        <div class="tl-hook">${esc(t.hook||'(no hook)')}</div>
        <div class="tl-meta">${badge(t.status)}${riskBadge(t.risk_level)}<span class="tl-time">${esc(t.created_kst||'')}</span></div>
      </div>
    </div>`).join('');
}

function renderAI(){
  const p=D.providers;
  const configs=[
    {role:'DraftWriter',emoji:'✍️',color:'#19c37d',glow:'rgba(25,195,125,.25)'},
    {role:'Reviewer',emoji:'🔍',color:'#cc785c',glow:'rgba(204,120,92,.25)'},
    {role:'Researcher',emoji:'🦊',color:'#4f8eff',glow:'rgba(79,142,255,.25)'},
    {role:'FactChecker',emoji:'🧩',color:'#a855f7',glow:'rgba(168,85,247,.25)'},
    {role:'TrendHunter',emoji:'📡',color:'#22d3ee',glow:'rgba(34,211,238,.25)'},
  ];
  if(!p){document.getElementById('provider-list').innerHTML='<div class="empty-state">데이터 없음</div>';return;}
  const roleMap={};(p.roles||[]).forEach(r=>{roleMap[r.role]=r;});
  document.getElementById('provider-list').innerHTML=configs.map(cfg=>{
    const r=roleMap[cfg.role]||{};
    const count=r.runs_today??'—';
    const cfgd=r.configured!==false;
    return `<div class="provider-card">
      <div class="prov-avatar" style="background:${cfg.glow};border-color:${cfg.color}">${cfg.emoji}</div>
      <div class="prov-info">
        <div class="prov-role">${esc(cfg.role)}</div>
        <div class="prov-name">${esc(r.provider||'—')}</div>
        <div class="prov-status">${dot(cfgd)}<span style="font-size:11px;color:var(--txt3)">${cfgd?'연결됨':'미설정'}</span></div>
      </div>
      <div class="prov-right">
        <div class="prov-count" style="color:${cfg.color}">${count}</div>
        <div class="prov-count-lbl">오늘</div>
      </div>
    </div>`;
  }).join('');
}

function pipelineStages(status){
  // returns array of {label, cls}
  const stages=['Source','Research','Draft','Review','Approval'];
  const maps={
    published:['done','done','done','done','done'],
    approved:['done','done','done','done','active'],
    pending:['done','done','done','active','pending'],
    rejected:['done','done','done','done','rejected'],
    deferred:['done','done','done','done','deferred'],
    failed:['done','done','done','done','failed'],
    regenerate:['done','done','active','pending','pending'],
  };
  const clses=maps[status]||maps['pending'];
  return stages.map((lbl,i)=>({label:lbl,cls:'pipe-'+clses[i]}));
}

function renderIntake(){
  // Naver
  const nv=D.naver;
  if(nv){
    const pct=Math.min(100,Math.round(nv.pct_used||0));
    const cls=gaugeClass(pct);
    const lvlCls='naver-'+((nv.level)||'ok');
    document.getElementById('naver-content').innerHTML=`
      <div class="naver-big">${(nv.used_today||0).toLocaleString()}</div>
      <div class="naver-sub">/ 25,000 일일 한도</div>
      <div class="gauge-track" style="margin-bottom:8px"><div class="gauge-fill ${cls}" style="width:${pct}%"></div></div>
      <div class="naver-status ${lvlCls}">${esc(nv.note||nv.level||'')}</div>`;
  } else {document.getElementById('naver-content').innerHTML='<div class="empty-state">데이터 없음</div>';}

  // Recent News
  const news=D.news||[];
  document.getElementById('news-list').innerHTML=news.length
    ?news.map(n=>`<div class="news-item">${esc(n.title||'')}</div>`).join('')
    :'<div class="empty-state">최근 뉴스 없음</div>';

  // Pipeline
  const latest=(D.trace||[])[0];
  const ps=pipelineStages(latest?.status||'pending');
  document.getElementById('pipeline-flow').innerHTML=ps.map((s,i)=>`
    ${i>0?'<span class="pipe-arrow">›</span>':''}
    <div class="pipe-node">
      <div class="pipe-circle ${s.cls}">${s.cls.includes('done')?'✓':s.cls.includes('rejected')?'✕':s.cls.includes('deferred')?'⏸':'•'}</div>
      <div class="pipe-label">${esc(s.label)}</div>
    </div>`).join('');

  // Recent Drafts (last 8)
  const trace=(D.trace||[]).slice(0,8);
  document.getElementById('intake-drafts').innerHTML=trace.length
    ?trace.map(t=>`
      <div class="draft-row">
        <div class="draft-hook">${esc(t.hook||'(no hook)')}</div>
        <div class="draft-meta">${badge(t.status)}${riskBadge(t.risk_level)}<span class="draft-time">${esc(t.created_kst||'')}</span></div>
      </div>`).join('')
    :'<div class="empty-state">초안 없음</div>';
}

function renderOps(){
  const s=D.status;
  if(!s)return;

  // Queue
  const qi=s.queue?.pending_items||[];
  const pc=s.queue?.pending_count??0;
  document.getElementById('queue-card-title').textContent=`큐 대기 (${pc})`;
  document.getElementById('queue-items').innerHTML=qi.length
    ?qi.map(item=>`
      <div class="queue-item">
        <div class="queue-text">${esc(item.text||'')}</div>
        <div class="queue-meta">
          <span class="queue-time">${kstFmt(item.added_at)}</span>
          <span class="${item.notified?'tag-notified':'tag-pending-notify'}">${item.notified?'알림완료':'알림대기'}</span>
        </div>
      </div>`).join('')
    :'<div class="empty-state">대기 항목 없음</div>';

  // Reply Monitor
  const mon=s.monitor||{};
  const paused=mon.reply_monitor_paused;
  document.getElementById('monitor-rows').innerHTML=`
    <div class="ops-row">
      <span class="ops-label">상태</span>
      <div style="display:flex;align-items:center;gap:6px">
        ${paused?'<span class="dot dot-amber"></span>':'<span class="dot dot-green"></span>'}
        <span class="ops-val">${paused?'일시정지':'활성'}</span>
      </div>
    </div>
    <div class="ops-row">
      <span class="ops-label">대기 리플라이 초안</span>
      <span class="ops-val">${mon.pending_reply_drafts??0}</span>
    </div>`;

  // News Monitor
  const nw=s.news||{};
  document.getElementById('news-monitor-rows').innerHTML=`
    <div class="ops-row"><span class="ops-label">대기 기사</span><span class="ops-val">${nw.pending_articles??0}</span></div>
    <div class="ops-row"><span class="ops-label">스토리 클러스터</span><span class="ops-val">${nw.story_clusters??0}</span></div>
    <div class="ops-row"><span class="ops-label">알림 스토리</span><span class="ops-val">${nw.alerted_stories??0}</span></div>
    <div class="ops-row"><span class="ops-label">야간 버퍼</span><span class="ops-val">${nw.overnight_buffer??0}</span></div>`;

  // Activity
  const act=s.activity||{};
  const idleH=act.hours_idle!=null?act.hours_idle.toFixed(1)+'h':'—';
  document.getElementById('activity-rows').innerHTML=`
    <div class="ops-row"><span class="ops-label">마지막 활동</span><span class="ops-val">${esc(act.last_activity_kst||'—')}</span></div>
    <div class="ops-row"><span class="ops-label">유휴 시간</span><span class="ops-val">${idleH}</span></div>
    <div class="ops-row">
      <span class="ops-label">유휴 상태</span>
      <div style="display:flex;align-items:center;gap:6px">
        ${act.is_idle?'<span class="dot dot-amber"></span>':'<span class="dot dot-green"></span>'}
        <span class="ops-val">${act.is_idle?'예':'아니오'}</span>
      </div>
    </div>
    <div class="ops-row"><span class="ops-label">마지막 발행</span><span class="ops-val">${kstFmt(s.queue?.last_published_at)}</span></div>`;
}

// Init
loadAll();
setInterval(loadAll, 30000);
</script>
