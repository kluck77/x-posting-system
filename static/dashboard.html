<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X Posting System — Dashboard</title>
  <style>
    :root {
      --bg-base:     #0b0d12;
      --bg-surface:  #12161e;
      --bg-elev:     #1a1f29;
      --border:      #232a36;
      --text-pri:    #e6ebf2;
      --text-sec:    #9aa4b2;
      --text-mut:    #6b7380;
      --accent:      #6ea8fe;
      --danger:      #ff8a8a;
      --ok:          #7ad08a;
      --radius:      10px;
      --gap:         16px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg-base); color: var(--text-pri);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 14px; line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }
    header { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg-surface);
      display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .3px; }
    header .env { font-family: var(--mono); color: var(--text-mut); font-size: 12px; }
    nav.tabs { display: flex; gap: 4px; padding: 0 16px; background: var(--bg-surface);
      border-bottom: 1px solid var(--border); }
    nav.tabs button { background: transparent; border: 0; color: var(--text-sec);
      padding: 12px 16px; cursor: pointer; font-size: 13px; font-weight: 500;
      border-bottom: 2px solid transparent; }
    nav.tabs button:hover { color: var(--text-pri); }
    nav.tabs button.active { color: var(--text-pri); border-bottom-color: var(--accent); }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    h2.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--text-mut); margin: 28px 0 10px; font-weight: 600; }
    h2.section-title:first-child { margin-top: 0; }
    .card { background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px; margin-bottom: var(--gap); }
    .empty { color: var(--text-mut); font-style: italic; font-size: 13px; }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; font-size: 13px; }
    .kv dt { color: var(--text-mut); font-weight: 500; }
    .kv dd { margin: 0; color: var(--text-pri); white-space: pre-wrap; word-break: break-word; }
    ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    ul.items > li { background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; font-size: 13px; }
    ul.items > li pre { margin: 0; font-family: var(--mono); font-size: 12px;
      white-space: pre-wrap; color: var(--text-sec); }
    .pill { display: inline-block; background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--text-sec);
      margin: 0 4px 4px 0; }
    .error-banner { background: #2a1618; border: 1px solid #5a2a2f; color: var(--danger);
      padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
    footer { padding: 16px 24px; color: var(--text-mut); font-size: 12px; text-align: center;
      border-top: 1px solid var(--border); margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>X Posting System</h1>
    <span class="env">Dashboard · Phase A</span>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="strategy-os" class="active">Strategy OS</button>
  </nav>

  <main>
    <section class="tab-panel active" id="tab-strategy-os" data-tab="strategy-os">
      <div id="strategy-os-error" class="error-banner" style="display:none"></div>
      <div id="strategy-os-root">
        <p class="empty">Loading…</p>
      </div>
    </section>
  </main>

  <footer>read-only · Phase A</footer>

  <script>
    // --- 탭 전환 (지금은 탭 하나지만 shell 은 확장 대비) ---
    document.getElementById('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-tab]');
      if (!btn) return;
      const key = btn.dataset.tab;
      document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.tab === key));
    });

    // --- 렌더 헬퍼 ---
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function renderValue(v) {
      if (v == null) return '<span class="empty">—</span>';
      if (typeof v === 'string') return esc(v) || '<span class="empty">—</span>';
      if (typeof v === 'number' || typeof v === 'boolean') return esc(String(v));
      return '<pre>' + esc(JSON.stringify(v, null, 2)) + '</pre>';
    }
    function renderList(arr) {
      if (!Array.isArray(arr) || arr.length === 0) {
        return '<p class="empty">(비어있음 — Strategy OS JSON 에서 채워주세요)</p>';
      }
      const items = arr.map(item => {
        if (item == null) return '<li><span class="empty">—</span></li>';
        if (typeof item === 'string' || typeof item === 'number' || typeof item === 'boolean') {
          return '<li>' + esc(String(item)) + '</li>';
        }
        if (typeof item === 'object') {
          const rows = Object.entries(item).map(([k, v]) =>
            '<dt>' + esc(k) + '</dt><dd>' + renderValue(v) + '</dd>'
          ).join('');
          return '<li><dl class="kv">' + rows + '</dl></li>';
        }
        return '<li>' + esc(String(item)) + '</li>';
      }).join('');
      return '<ul class="items">' + items + '</ul>';
    }
    function renderPositioning(p) {
      p = p || {};
      const lenses = Array.isArray(p.lenses) ? p.lenses : [];
      const donots = Array.isArray(p.do_not_do) ? p.do_not_do : [];
      const lensPills = lenses.length
        ? lenses.map(l => '<span class="pill">' + esc(typeof l === 'string' ? l : JSON.stringify(l)) + '</span>').join('')
        : '<span class="empty">(없음)</span>';
      return (
        '<div class="card">' +
          '<dl class="kv">' +
            '<dt>one_liner</dt><dd>' + renderValue(p.one_liner) + '</dd>' +
            '<dt>lenses</dt><dd>' + lensPills + '</dd>' +
          '</dl>' +
        '</div>' +
        '<h2 class="section-title">Do Not Do</h2>' +
        '<div class="card">' + renderList(donots) + '</div>'
      );
    }
    function section(title, bodyHtml) {
      return '<h2 class="section-title">' + esc(title) + '</h2>' +
        '<div class="card">' + bodyHtml + '</div>';
    }

    async function loadStrategyOS() {
      const root = document.getElementById('strategy-os-root');
      const err  = document.getElementById('strategy-os-error');
      err.style.display = 'none';
      try {
        const res = await fetch('/control/strategy-os', { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        root.innerHTML = [
          '<h2 class="section-title">Positioning</h2>',
          renderPositioning(data.positioning),
          section('Content Pillars',        renderList(data.content_pillars)),
          section('Series',                 renderList(data.series)),
          section('Hook Library',           renderList(data.hook_library)),
          section('RT Trigger Rules',       renderList(data.rt_trigger_rules)),
          section('Banned Style',           renderList(data.banned_style)),
          section('Good Examples',          renderList(data.good_examples)),
          section('Bad Examples',           renderList(data.bad_examples)),
          section('Weekly Review Checklist',renderList(data.weekly_review_checklist)),
        ].join('');
      } catch (e) {
        // 탭 로딩 실패해도 shell / 다른 탭은 안 깨진다
        err.textContent = 'Strategy OS 로딩 실패: ' + (e && e.message ? e.message : e);
        err.style.display = 'block';
        root.innerHTML = '<p class="empty">데이터를 표시할 수 없습니다. 서버 로그를 확인하세요.</p>';
      }
    }

    loadStrategyOS();
  </script>
</body>
</html>
