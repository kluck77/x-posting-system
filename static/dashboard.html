<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>X Control Room</title>
<style>
:root {
  --bg: #0b0d14;
  --surface: #141720;
  --surface2: #1a1e2e;
  --border: rgba(255,255,255,0.07);
  --txt: #e2e6f0;
  --txt2: #7b8299;
  --txt3: #4b5168;
  --accent: #4f8eff;
  --green: #22c55e;
  --amber: #f59e0b;
  --red: #ef4444;
  --purple: #a855f7;
  --cyan: #22d3ee;
  --header-h: 56px;
  --tab-h: 60px;
  --shadow-card: 0 2px 16px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.3);
  --glow-accent: rgba(79,142,255,0.35);
  --glow-green: rgba(34,197,94,0.35);
  --glow-amber: rgba(245,158,11,0.35);
  --glow-red: rgba(239,68,68,0.35);
  --glow-purple: rgba(168,85,247,0.35);
  --glow-cyan: rgba(34,211,238,0.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px}
body{height:100dvh;height:-webkit-fill-available;overflow:hidden;background:var(--bg)}

.app-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding-top:env(safe-area-inset-top);
  height:calc(var(--header-h) + env(safe-area-inset-top));
  background:rgba(11,13,20,0.88);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:flex-end;
}
.header-inner{
  width:100%;padding:0 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.header-title{font-size:17px;font-weight:700;letter-spacing:-0.3px}
.header-right{display:flex;align-items:center;gap:10px}
#last-refresh{font-size:11px;color:var(--txt3)}
#refresh-btn{
  background:none;border:1px solid var(--border);color:var(--txt2);
  border-radius:8px;padding:5px 10px;font-size:15px;cursor:pointer;
  transition:color .2s;
}
#refresh-btn:active{color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .7s linear infinite;display:inline-block}
/* Combined mascot idle: float + breathe in one keyframe to avoid Safari transform conflict */
@keyframes mascot-idle{
  0%  {transform:translateY(0) scale(1)}
  20% {transform:translateY(-3px) scale(1.04)}
  50% {transform:translateY(-6px) scale(1.08)}
  80% {transform:translateY(-3px) scale(1.04)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes ring-pulse{
  0%,100%{opacity:0.25;transform:scale(0.94)}
  50%{opacity:0.9;transform:scale(1.06);box-shadow:0 0 22px rgba(79,142,255,0.55)}
}
@keyframes ring-pulse-green{
  0%,100%{opacity:0.2;transform:scale(0.94)}
  50%{opacity:0.85;transform:scale(1.06);box-shadow:0 0 22px rgba(34,197,94,0.55)}
}
@keyframes radar-sweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes avatar-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes avatar-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes avatar-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes dot-blink{0%,100%{opacity:1}50%{opacity:0.35}}
@keyframes pulse-glow-green{0%,100%{box-shadow:0 0 6px rgba(34,197,94,0.5)}50%{box-shadow:0 0 16px rgba(34,197,94,1),0 0 28px rgba(34,197,94,0.4)}}
@keyframes pulse-glow-red{0%,100%{box-shadow:0 0 6px rgba(239,68,68,0.5)}50%{box-shadow:0 0 16px rgba(239,68,68,1),0 0 28px rgba(239,68,68,0.4)}}
@keyframes pulse-glow-amber{0%,100%{box-shadow:0 0 6px rgba(245,158,11,0.5)}50%{box-shadow:0 0 16px rgba(245,158,11,1),0 0 28px rgba(245,158,11,0.4)}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}

.content{
  position:fixed;
  top:calc(var(--header-h) + env(safe-area-inset-top));
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));
  left:0;right:0;overflow:hidden;
}

.page{
  position:absolute;inset:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:none;flex-direction:column;gap:12px;
  padding:12px 16px 16px;
}
.page.active{display:flex}

.tab-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(11,13,20,0.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;align-items:flex-start;
}
.tab-bar-inner{display:flex;width:100%;padding-top:4px}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:2px;min-height:56px;padding:6px 4px 4px;
  background:none;border:none;color:var(--txt3);cursor:pointer;
  transition:color .2s;font-size:10px;letter-spacing:0.3px;
  position:relative;
}
.tab-btn::after{
  content:'';position:absolute;top:0;left:25%;right:25%;
  height:2px;background:var(--accent);border-radius:0 0 3px 3px;
  opacity:0;transition:opacity .2s;
}
.tab-btn .tab-icon{font-size:24px;line-height:1;transition:transform .2s}
.tab-btn.active{color:var(--accent)}
.tab-btn.active::after{opacity:1}
.tab-btn.active .tab-icon{transform:scale(1.1)}

.card{
  background:var(--surface);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:14px;padding:14px 16px;
  box-shadow:0 4px 24px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
}
.card-title{font-size:11px;font-weight:700;color:var(--txt3);
  text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px}
.card-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title-row .card-title{margin-bottom:0}

.alert-banner{
  background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);
  border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;
  color:var(--red);font-size:13px;font-weight:500;
}
.alert-banner.hidden{display:none}

.mascot-card{
  background:linear-gradient(140deg,#131620 0%,#1a2040 50%,#131a2e 100%);
  border:1px solid rgba(79,142,255,0.35);border-radius:18px;padding:20px 16px;
  box-shadow:0 0 40px rgba(79,142,255,0.12), 0 4px 24px rgba(0,0,0,0.55), inset 0 1px 0 rgba(79,142,255,0.15);
}
.mascot-row{display:flex;align-items:center;gap:16px}
/* Mascot avatar wrapper with pulsing ring */
.mascot-avatar-wrap{
  position:relative;width:68px;height:68px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.mascot-ring{
  position:absolute;inset:-8px;border-radius:50%;
  border:2px solid rgba(79,142,255,0.5);
  animation:ring-pulse 3s ease-in-out infinite;
  pointer-events:none;
}
.mascot-ring-ok{
  position:absolute;inset:-8px;border-radius:50%;
  border:2px solid rgba(34,197,94,0.5);
  animation:ring-pulse-green 3s ease-in-out infinite;
  pointer-events:none;
  display:none;
}
.mascot-emoji{
  font-size:52px;line-height:1;display:inline-block;
  animation:mascot-idle 5s ease-in-out infinite;
  transform-origin:center;will-change:transform;
  position:relative;z-index:1;
}
.mascot-text{flex:1;min-width:0}
.mascot-text h2{font-size:19px;font-weight:800;margin-bottom:4px;letter-spacing:-0.3px}
.mascot-text p{font-size:12px;color:var(--txt2);line-height:1.4}
/* Live status badge */
.mascot-live{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;
  color:var(--green);margin-bottom:6px;
}
.mascot-live-dot{
  width:7px;height:7px;border-radius:50%;background:var(--green);
  animation:pulse-glow-green 2s ease-in-out infinite;
  flex-shrink:0;
}

.quick-stats{display:flex;gap:8px}
.stat-chip{
  flex:1;
  background:linear-gradient(145deg,#1a1e2e,#1e2438);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:13px;padding:13px 8px;text-align:center;
  box-shadow:0 4px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.07);
}
.stat-chip .chip-val{font-size:26px;font-weight:800;line-height:1.1}
.stat-chip .chip-lbl{font-size:10px;color:var(--txt3);margin-top:4px;letter-spacing:0.5px;text-transform:uppercase}

.health-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-bottom:1px solid var(--border);
}
.health-row:last-child{border-bottom:none}
.health-label{font-size:14px;color:var(--txt)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.dot-green{background:var(--green);animation:pulse-glow-green 2.5s ease-in-out infinite}
.dot-red{background:var(--red);animation:pulse-glow-red 2.5s ease-in-out infinite}
.dot-amber{background:var(--amber);animation:pulse-glow-amber 2.5s ease-in-out infinite}
.dot-gray{background:var(--txt3)}

.gauge-wrap{margin-bottom:12px}
.gauge-wrap:last-child{margin-bottom:0}
.gauge-header{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.gauge-label{color:var(--txt2)}
.gauge-nums{color:var(--txt)}
.gauge-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.gauge-fill{height:100%;border-radius:3px;transition:width .4s ease}
.gauge-fill.ok{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,0.45)}
.gauge-fill.caution{background:var(--amber);box-shadow:0 0 8px rgba(245,158,11,0.45)}
.gauge-fill.warning{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,0.45)}
.gauge-fill.idle{background:var(--txt3)}

.timeline-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--border);
}
.timeline-item:last-child{border-bottom:none}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
  margin-top:5px;flex-shrink:0}
.tl-body{flex:1;min-width:0}
.tl-hook{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.tl-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-time{font-size:11px;color:var(--txt3)}

.badge{
  display:inline-block;padding:2px 7px;border-radius:5px;
  font-size:10px;font-weight:600;letter-spacing:0.3px;white-space:nowrap;
}
.badge-pending{background:rgba(245,158,11,0.15);color:var(--amber)}
.badge-approved{background:rgba(79,142,255,0.15);color:var(--accent)}
.badge-published{background:rgba(34,197,94,0.15);color:var(--green)}
.badge-rejected{background:rgba(239,68,68,0.15);color:var(--red)}
.badge-deferred{background:rgba(123,130,153,0.15);color:var(--txt2)}
.badge-failed{background:rgba(239,68,68,0.2);color:var(--red)}
.badge-regenerate{background:rgba(168,85,247,0.15);color:var(--purple)}
.badge-low{background:rgba(34,197,94,0.12);color:var(--green)}
.badge-medium{background:rgba(245,158,11,0.12);color:var(--amber)}
.badge-high{background:rgba(239,68,68,0.12);color:var(--red)}

.provider-card{
  display:flex;align-items:center;gap:14px;
  padding:14px 0;border-bottom:1px solid var(--border);
}
.provider-card:last-child{border-bottom:none}
.provider-avatar{
  width:48px;height:48px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;border:1px solid transparent;
  transition:transform .2s ease;will-change:transform;
}
.provider-info{flex:1;min-width:0}
.provider-role{font-size:14px;font-weight:700;letter-spacing:-0.2px}
.provider-sub{font-size:12px;color:var(--txt2);margin-top:2px}
.provider-tagline{font-size:11px;color:var(--txt3);margin-top:3px;letter-spacing:0.1px}
.provider-count{text-align:right;flex-shrink:0}
.provider-count .cnt{font-size:28px;font-weight:700;line-height:1}
.provider-count .cnt-lbl{font-size:10px;color:var(--txt3);margin-top:2px}
/* Role-specific avatar animations — single transform each to avoid Safari conflict */
.role-draft .provider-avatar{animation:dot-blink 1.2s ease-in-out infinite}
.role-review .provider-avatar{animation:avatar-breathe 3s ease-in-out infinite}
.role-research .provider-avatar{animation:avatar-bob 4s ease-in-out infinite}
.role-fact .provider-avatar{animation:avatar-breathe 2.2s ease-in-out infinite}
.role-trend .provider-avatar{animation:avatar-spin 5s linear infinite}
/* Naver intake context */
.naver-context{font-size:11px;color:var(--txt3);margin-top:6px;letter-spacing:0.1px}
.naver-intake-hint{
  font-size:12px;color:var(--txt2);margin-top:10px;padding:8px 10px;
  background:rgba(79,142,255,0.06);border-left:2px solid rgba(79,142,255,0.3);border-radius:4px;
}
@media(prefers-reduced-motion:reduce){
  .mascot-emoji,.mascot-ring,.mascot-ring-ok,
  .role-draft .provider-avatar,.role-review .provider-avatar,
  .role-research .provider-avatar,.role-fact .provider-avatar,.role-trend .provider-avatar
  {animation:none!important;transform:none!important}
  .dot-green,.dot-red,.dot-amber,.mascot-live-dot{animation:none!important;
    box-shadow:0 0 6px rgba(34,197,94,0.5)}
}
.footnote{font-size:11px;color:var(--txt3);text-align:center;padding-top:4px}

.naver-big{display:flex;align-items:baseline;gap:6px;margin-bottom:12px}
.naver-big .nb-val{font-size:36px;font-weight:700}
.naver-big .nb-of{font-size:16px;color:var(--txt2)}
.naver-status{font-size:12px;margin-top:8px}

.news-item{
  padding:9px 0;border-bottom:1px solid var(--border);
  font-size:13px;color:var(--txt);line-height:1.4;
}
.news-item:last-child{border-bottom:none}
.empty-state{font-size:13px;color:var(--txt3);padding:8px 0;text-align:center}

.pipeline-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.pipeline{display:flex;align-items:center;min-width:max-content;padding:4px 0}
.pipe-node{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  min-width:64px;padding:8px 4px;
}
.pipe-icon{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;border:2px solid transparent;
}
.pipe-icon.done{background:rgba(34,197,94,0.15);border-color:var(--green);color:var(--green)}
.pipe-icon.active{background:rgba(79,142,255,0.15);border-color:var(--accent);color:var(--accent)}
.pipe-icon.pending{background:rgba(75,81,104,0.15);border-color:var(--txt3);color:var(--txt3)}
.pipe-icon.fail{background:rgba(239,68,68,0.15);border-color:var(--red);color:var(--red)}
.pipe-lbl{font-size:10px;color:var(--txt2);white-space:nowrap}
.pipe-connector{width:16px;height:2px;background:var(--border);flex-shrink:0;align-self:center;margin-bottom:18px}

.draft-row{
  display:flex;align-items:center;gap:8px;
  padding:9px 0;border-bottom:1px solid var(--border);
}
.draft-row:last-child{border-bottom:none}
.draft-hook{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.draft-badges{display:flex;gap:4px;align-items:center;flex-shrink:0}
.draft-time{font-size:11px;color:var(--txt3);flex-shrink:0}

.queue-item{padding:10px 0;border-bottom:1px solid var(--border)}
.queue-item:last-child{border-bottom:none}
.queue-text{font-size:13px;line-height:1.4;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.queue-meta{display:flex;align-items:center;gap:8px}
.queue-time{font-size:11px;color:var(--txt3)}
.notified-tag{font-size:10px;padding:1px 6px;border-radius:4px;background:rgba(79,142,255,0.12);color:var(--accent)}

.ops-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;
}
.ops-row:last-child{border-bottom:none}
.ops-val{font-weight:600;color:var(--txt)}
.ops-lbl{color:var(--txt2)}

.page-title{font-size:22px;font-weight:700;padding:4px 0 4px}

@media(min-width:640px){
  .tab-bar-inner,.header-inner{max-width:640px;margin:0 auto}
  .page{max-width:640px;left:50%;right:auto;width:640px;transform:translateX(-50%)}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <span class="header-title">🛰️ X Control Room</span>
    <div class="header-right">
      <span id="last-refresh">—</span>
      <button id="refresh-btn" onclick="loadAll()">↻</button>
    </div>
  </div>
</header>

<div class="content">

  <!-- TAB 1: STATUS -->
  <div class="page active" id="page-home">
    <div id="alert-banner" class="alert-banner hidden">⚠️ <span id="alert-text"></span></div>
    <div class="mascot-card">
      <div class="mascot-row">
        <div class="mascot-avatar-wrap">
          <div class="mascot-ring" id="mascot-ring"></div>
          <div class="mascot-ring-ok" id="mascot-ring-ok"></div>
          <div class="mascot-emoji" id="mascot-emoji">👩‍💻</div>
        </div>
        <div class="mascot-text">
          <div class="mascot-live" id="mascot-live"><span class="mascot-live-dot"></span>LIVE</div>
          <h2 id="mascot-headline">시스템 정상 운영 중</h2>
          <p id="mascot-sub">데이터 로딩 중…</p>
        </div>
      </div>
    </div>
    <div class="quick-stats">
      <div class="stat-chip">
        <div class="chip-val" id="qs-queue">—</div>
        <div class="chip-lbl">Queue</div>
      </div>
      <div class="stat-chip">
        <div class="chip-val" id="qs-monitor">—</div>
        <div class="chip-lbl">Monitor</div>
      </div>
      <div class="stat-chip">
        <div class="chip-val" id="qs-naver">—</div>
        <div class="chip-lbl">Naver %</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">System Health</div>
      <div id="health-rows"></div>
    </div>
    <div class="card">
      <div class="card-title">Daily Quota</div>
      <div id="quota-gauges"></div>
    </div>
    <div class="card">
      <div class="card-title">Recent Activity</div>
      <div id="home-timeline"></div>
    </div>
  </div>

  <!-- TAB 2: AI -->
  <div class="page" id="page-ai">
    <div class="page-title">🤖 AI 현황</div>
    <div class="card">
      <div id="provider-list"></div>
    </div>
    <p class="footnote">※ 실행 횟수는 오늘 생성된 초안 수 기준</p>
  </div>

  <!-- TAB 3: INTAKE -->
  <div class="page" id="page-intake">
    <div class="page-title">📰 인풋 &amp; 플로우</div>
    <div class="card">
      <div class="card-title">Naver API</div>
      <div class="naver-big">
        <span class="nb-val" id="naver-used">—</span>
        <span class="nb-of">/ 25,000</span>
      </div>
      <div id="naver-gauge"></div>
      <div class="naver-status" id="naver-note"></div>
      <div class="naver-context" id="naver-context"></div>
      <div class="naver-intake-hint" id="naver-intake-hint" style="display:none"></div>
    </div>
    <div class="card">
      <div class="card-title">Recent News</div>
      <div id="news-list"></div>
    </div>
    <div class="card">
      <div class="card-title">Pipeline Flow</div>
      <div class="pipeline-scroll">
        <div class="pipeline" id="pipeline-flow"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Recent Drafts</div>
      <div id="draft-rows"></div>
    </div>
  </div>

  <!-- TAB 4: OPS -->
  <div class="page" id="page-ops">
    <div class="page-title">⚙️ 운영 현황</div>
    <div class="card">
      <div class="card-title-row">
        <span class="card-title">Queue</span>
        <span id="queue-count-badge" class="badge badge-pending">0 pending</span>
      </div>
      <div id="queue-list"></div>
    </div>
    <div class="card">
      <div class="card-title">Reply Monitor</div>
      <div id="monitor-rows"></div>
    </div>
    <div class="card">
      <div class="card-title">News Monitor</div>
      <div id="news-monitor-rows"></div>
    </div>
    <div class="card">
      <div class="card-title">Activity</div>
      <div id="activity-rows"></div>
    </div>
  </div>

</div>

<nav class="tab-bar">
  <div class="tab-bar-inner">
    <button class="tab-btn active" onclick="switchTab('home')">
      <span class="tab-icon">🏠</span>Status
    </button>
    <button class="tab-btn" onclick="switchTab('ai')">
      <span class="tab-icon">🤖</span>AI
    </button>
    <button class="tab-btn" onclick="switchTab('intake')">
      <span class="tab-icon">📰</span>Intake
    </button>
    <button class="tab-btn" onclick="switchTab('ops')">
      <span class="tab-icon">⚙️</span>Ops
    </button>
  </div>
</nav>

<script>
'use strict';
const D = {};

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function kstFmt(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleString('ko-KR', {timeZone:'Asia/Seoul', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
  } catch(e) { return String(iso); }
}
function badge(status) {
  const labels = {pending:'대기', approved:'승인', published:'게시', rejected:'거절', deferred:'보류', failed:'실패', regenerate:'재생성'};
  const cls = labels[status] ? status : 'deferred';
  return `<span class="badge badge-${esc(cls)}">${esc(labels[status] || status)}</span>`;
}
function riskBadge(risk) {
  if (!risk) return '';
  return `<span class="badge badge-${esc(risk)}">${esc(risk)}</span>`;
}
function dot(ok) {
  return `<span class="dot ${ok ? 'dot-green' : 'dot-red'}"></span>`;
}
function dotAmber(on) {
  return `<span class="dot ${on ? 'dot-amber' : 'dot-green'}"></span>`;
}
function gaugeClass(pct) {
  if (pct < 50) return 'ok';
  if (pct < 75) return 'caution';
  return 'warning';
}
function gaugeBar(used, limit, label) {
  if (!limit) return '';
  const pct = Math.min(100, Math.round(used / limit * 100));
  const cls = gaugeClass(pct);
  const labelHtml = label ? `<span class="gauge-label">${esc(label)}</span>` : '<span></span>';
  return `<div class="gauge-wrap">
    <div class="gauge-header">${labelHtml}<span class="gauge-nums">${used} / ${limit}</span></div>
    <div class="gauge-track"><div class="gauge-fill ${cls}" style="width:${pct}%"></div></div>
  </div>`;
}

function switchTab(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  const idx = {home:0, ai:1, intake:2, ops:3}[id] ?? 0;
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
}

async function loadAll() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  const [r1,r2,r3,r4,r5] = await Promise.allSettled([
    fetch('/control/status').then(r => r.json()),
    fetch('/control/providers').then(r => r.json()),
    fetch('/control/flow-trace?limit=15').then(r => r.json()),
    fetch('/control/naver').then(r => r.json()),
    fetch('/control/recent-news?limit=8').then(r => r.json()),
  ]);
  D.status    = r1.status === 'fulfilled' ? r1.value : null;
  D.providers = r2.status === 'fulfilled' ? r2.value : null;
  D.trace     = r3.status === 'fulfilled' ? r3.value : [];
  D.naver     = r4.status === 'fulfilled' ? r4.value : null;
  D.news      = r5.status === 'fulfilled' ? r5.value : [];
  renderAll();
  btn.classList.remove('spinning');
  const kst = D.status?.generated_at_kst || new Date().toLocaleTimeString('ko-KR', {timeZone:'Asia/Seoul'});
  document.getElementById('last-refresh').textContent = kst;
}

function renderAll() { renderHome(); renderAI(); renderIntake(); renderOps(); }

function renderHome() {
  const s = D.status;
  const banner = document.getElementById('alert-banner');
  let alertMsg = '';
  if (s?.activity?.is_idle) alertMsg = `48시간 이상 비활성 (${s.activity.hours_idle?.toFixed(1)}h 경과)`;
  else if (s && !s.health?.db_ok) alertMsg = 'DB 연결 오류 — 확인 필요';
  else if (s && !s.health?.x_configured) alertMsg = 'X API 미설정';
  if (alertMsg) {
    banner.classList.remove('hidden');
    document.getElementById('alert-text').textContent = alertMsg;
  } else {
    banner.classList.add('hidden');
  }

  const u = s?.usage;
  const isIdle = s?.activity?.is_idle;
  const isOk = s && !isIdle && s.health?.db_ok;
  // Mascot emoji + headline
  document.getElementById('mascot-emoji').textContent = isIdle ? '😴' : (s ? '👩‍💻' : '🔌');
  document.getElementById('mascot-headline').textContent =
    s ? (isIdle ? '장시간 비활성 상태' : '시스템 정상 운영 중') : '연결 없음';
  document.getElementById('mascot-sub').textContent =
    u ? `초안 ${u.drafts.used}/${u.drafts.limit} · 게시 ${u.posts.used}/${u.posts.limit} · 오늘` : '연결 확인 중…';
  // Live badge + ring color: blue (loading/idle) vs green (ok)
  const liveEl = document.getElementById('mascot-live');
  const ringEl = document.getElementById('mascot-ring');
  const ringOkEl = document.getElementById('mascot-ring-ok');
  if (liveEl) {
    liveEl.style.color = isIdle ? 'var(--amber)' : isOk ? 'var(--green)' : 'var(--txt2)';
    liveEl.innerHTML = `<span class="mascot-live-dot" style="background:${isIdle?'var(--amber)':isOk?'var(--green)':'var(--txt2)'}"></span>${isIdle?'IDLE':isOk?'LIVE':'—'}`;
  }
  if (ringEl && ringOkEl) {
    ringEl.style.display = isOk ? 'none' : '';
    ringOkEl.style.display = isOk ? '' : 'none';
  }

  const qc = s?.queue?.pending_count ?? '—';
  const qEl = document.getElementById('qs-queue');
  qEl.textContent = qc;
  qEl.style.color = (typeof qc === 'number' && qc > 0) ? 'var(--amber)' : 'var(--green)';

  const mon = s?.monitor;
  const monEl = document.getElementById('qs-monitor');
  if (mon) {
    monEl.textContent = mon.reply_monitor_paused ? 'OFF' : 'ON';
    monEl.style.color = mon.reply_monitor_paused ? 'var(--amber)' : 'var(--green)';
  } else { monEl.textContent = '—'; monEl.style.color = ''; }

  const nEl = document.getElementById('qs-naver');
  if (D.naver) {
    nEl.textContent = (D.naver.pct_used?.toFixed(1) ?? '—') + '%';
    nEl.style.color = D.naver.level === 'warning' ? 'var(--red)' : D.naver.level === 'caution' ? 'var(--amber)' : 'var(--green)';
  } else { nEl.textContent = '—'; nEl.style.color = ''; }

  const h = s?.health;
  document.getElementById('health-rows').innerHTML = !h ? '<div class="empty-state">연결 실패</div>' : [
    ['DB', h.db_ok, false],
    ['Telegram', h.telegram_configured, false],
    ['X API', h.x_configured, false],
    ['Mock Mode', h.mock_mode, true],
    ['Auto-Post', h.auto_post_enabled, true],
  ].map(([lbl, val, isWarningOn]) => {
    const dotHtml = isWarningOn
      ? `<span class="dot ${val ? 'dot-amber' : 'dot-green'}"></span>`
      : dot(val);
    return `<div class="health-row"><span class="health-label">${esc(lbl)}</span>${dotHtml}</div>`;
  }).join('');

  const ug = s?.usage;
  document.getElementById('quota-gauges').innerHTML = !ug ? '<div class="empty-state">—</div>' : [
    gaugeBar(ug.drafts.used, ug.drafts.limit, 'Drafts'),
    gaugeBar(ug.telegram.used, ug.telegram.limit, 'Telegram'),
    gaugeBar(ug.posts.used, ug.posts.limit, 'Posts'),
  ].join('');

  const trace = (D.trace || []).slice(0, 6);
  document.getElementById('home-timeline').innerHTML = !trace.length ? '<div class="empty-state">없음</div>' :
    trace.map(t => `<div class="timeline-item">
      <div class="tl-dot"></div>
      <div class="tl-body">
        <div class="tl-hook">${esc(t.hook)}</div>
        <div class="tl-meta">${badge(t.status)}${riskBadge(t.risk_level)}<span class="tl-time">${esc(t.created_kst)}</span></div>
      </div>
    </div>`).join('');
}

function renderAI() {
  const p = D.providers;
  if (!p) { document.getElementById('provider-list').innerHTML = '<div class="empty-state">연결 실패</div>'; return; }
  const meta = {
    DraftWriter: {emoji:'✍️', color:'#19c37d', glow:'rgba(25,195,125,0.2)', tagline:'초안 작성 · 5-criteria 자가검증', anim:'role-draft'},
    Reviewer:    {emoji:'🔍', color:'#cc785c', glow:'rgba(204,120,92,0.2)', tagline:'품질 검토 · PASS/WEAK/FAIL 최종 판정', anim:'role-review'},
    Researcher:  {emoji:'🦊', color:'#4f8eff', glow:'rgba(79,142,255,0.2)', tagline:'맥락 리서치 · 해석 갭 발굴', anim:'role-research'},
    FactChecker: {emoji:'🧩', color:'#a855f7', glow:'rgba(168,85,247,0.2)', tagline:'팩트체크 · 글로벌 관련성 평가', anim:'role-fact'},
    TrendHunter: {emoji:'📡', color:'#22d3ee', glow:'rgba(34,211,238,0.2)', tagline:'트렌드 탐지 · 시장성 필터링', anim:'role-trend'},
  };
  document.getElementById('provider-list').innerHTML = (p.roles || []).map(r => {
    const m = meta[r.role] || {emoji:'🤖', color:'var(--txt2)', glow:'rgba(123,130,153,0.12)', tagline:'', anim:''};
    const cfgHtml = r.configured
      ? `<span style="color:var(--green);font-size:11px">● 연결됨</span>`
      : `<span style="color:var(--red);font-size:11px">● 미설정</span>`;
    const cnt = r.runs_today ?? '—';
    const cntLbl = (cnt === '—' || cnt === 0) ? '미실행' : '실행';
    const noteHtml = r.note ? `<div style="font-size:11px;color:var(--txt3);margin-top:2px">${esc(r.note)}</div>` : '';
    return `<div class="provider-card ${m.anim || ''}">
      <div class="provider-avatar" style="background:${m.glow};border-color:${m.color};box-shadow:0 0 12px ${m.glow}">${m.emoji}</div>
      <div class="provider-info">
        <div class="provider-role" style="color:${m.color}">${esc(r.role)}</div>
        <div class="provider-sub">${esc(r.provider)} ${cfgHtml}</div>
        <div class="provider-tagline">${esc(m.tagline)}</div>
        ${noteHtml}
      </div>
      <div class="provider-count">
        <div class="cnt" style="color:${m.color}">${cnt}</div>
        <div class="cnt-lbl">${cntLbl}</div>
      </div>
    </div>`;
  }).join('');
}

function pipelineHTML(status) {
  const stages = [
    {label:'Source',  icon:'📥'},
    {label:'Research',icon:'🔭'},
    {label:'Draft',   icon:'✍️'},
    {label:'Review',  icon:'🔍'},
    {label:'Approval',icon:'✅'},
  ];
  const stateMap = {
    pending:    ['done','done','done','active','pending'],
    approved:   ['done','done','done','done','active'],
    published:  ['done','done','done','done','done'],
    rejected:   ['done','done','done','done','fail'],
    deferred:   ['done','done','done','done','fail'],
    failed:     ['done','done','done','done','fail'],
    regenerate: ['done','done','active','pending','pending'],
  };
  const states = stateMap[status] || ['done','done','done','active','pending'];
  return stages.map((st, i) =>
    (i > 0 ? '<div class="pipe-connector"></div>' : '') +
    `<div class="pipe-node">
      <div class="pipe-icon ${states[i]}">${st.icon}</div>
      <div class="pipe-lbl">${st.label}</div>
    </div>`
  ).join('');
}

function renderIntake() {
  const nv = D.naver;
  document.getElementById('naver-used').textContent = nv ? (nv.used_today || 0).toLocaleString() : '—';
  document.getElementById('naver-gauge').innerHTML = nv ? gaugeBar(nv.used_today, nv.daily_limit, '') : '';
  const lvlColor = {idle:'var(--txt3)', ok:'var(--green)', caution:'var(--amber)', warning:'var(--red)'};
  document.getElementById('naver-note').innerHTML = nv
    ? `<span style="color:${lvlColor[nv.level] || 'var(--txt2)'}">${esc(nv.note)}</span>` : '';
  // Naver context: remaining calls + intake hint
  const ctxEl = document.getElementById('naver-context');
  const hintEl = document.getElementById('naver-intake-hint');
  if (ctxEl && nv) {
    const remaining = nv.remaining ?? Math.max(0, (nv.daily_limit || 25000) - (nv.used_today || 0));
    ctxEl.textContent = `뉴스 기사 스캔용 API · 잔여 ${remaining.toLocaleString()} 콜`;
  }
  if (hintEl) {
    const news = D.news || [];
    if (news.length > 0) {
      hintEl.style.display = '';
      hintEl.textContent = `${news.length}개 기사 대기 중 — 관심 있는 기사를 Telegram에 링크로 보내면 초안이 생성됩니다`;
    } else {
      hintEl.style.display = 'none';
    }
  }

  const news = D.news || [];
  document.getElementById('news-list').innerHTML = !news.length
    ? '<div class="empty-state">최근 뉴스 없음</div>'
    : news.map(n => `<div class="news-item">${esc(n.title)}</div>`).join('');

  const latest = (D.trace || [])[0];
  document.getElementById('pipeline-flow').innerHTML = pipelineHTML(latest?.status || 'pending');

  const trace = (D.trace || []).slice(0, 8);
  document.getElementById('draft-rows').innerHTML = !trace.length
    ? '<div class="empty-state">초안 없음</div>'
    : trace.map(t => `<div class="draft-row">
        <span class="draft-hook">${esc(t.hook)}</span>
        <div class="draft-badges">${badge(t.status)}${riskBadge(t.risk_level)}</div>
        <span class="draft-time">${esc(t.created_kst)}</span>
      </div>`).join('');
}

function renderOps() {
  const s = D.status;
  const qItems = s?.queue?.pending_items || [];
  const qTotal = s?.queue?.pending_count ?? 0;
  document.getElementById('queue-count-badge').textContent = `${qTotal} pending`;
  document.getElementById('queue-list').innerHTML = !qItems.length
    ? '<div class="empty-state">큐 비어 있음</div>'
    : qItems.map(item => `<div class="queue-item">
        <div class="queue-text">${esc(item.text)}</div>
        <div class="queue-meta">
          <span class="queue-time">${kstFmt(item.added_at)}</span>
          ${item.notified ? '<span class="notified-tag">알림 완료</span>' : ''}
        </div>
      </div>`).join('');

  const mon = s?.monitor;
  document.getElementById('monitor-rows').innerHTML = !mon ? '<div class="empty-state">—</div>' : `
    <div class="ops-row">
      <span class="ops-lbl">상태</span>
      <span class="ops-val" style="color:${mon.reply_monitor_paused ? 'var(--amber)' : 'var(--green)'}">
        ${mon.reply_monitor_paused ? '⏸ 일시정지' : '▶ 활성'}
      </span>
    </div>
    <div class="ops-row">
      <span class="ops-lbl">대기 중 답글 초안</span>
      <span class="ops-val">${mon.pending_reply_drafts ?? 0}</span>
    </div>`;

  const nm = s?.news;
  document.getElementById('news-monitor-rows').innerHTML = !nm ? '<div class="empty-state">—</div>' : `
    <div class="ops-row"><span class="ops-lbl">대기 기사</span><span class="ops-val">${nm.pending_articles ?? 0}</span></div>
    <div class="ops-row"><span class="ops-lbl">스토리 클러스터</span><span class="ops-val">${nm.story_clusters ?? 0}</span></div>
    <div class="ops-row"><span class="ops-lbl">알림 발송 스토리</span><span class="ops-val">${nm.alerted_stories ?? 0}</span></div>
    <div class="ops-row"><span class="ops-lbl">야간 버퍼</span><span class="ops-val">${nm.overnight_buffer ?? 0}</span></div>`;

  const act = s?.activity;
  const lastPub = s?.queue?.last_published_at;
  document.getElementById('activity-rows').innerHTML = !act ? '<div class="empty-state">—</div>' : `
    <div class="ops-row">
      <span class="ops-lbl">마지막 활동</span>
      <span class="ops-val">${esc(act.last_activity_kst || '—')}</span>
    </div>
    <div class="ops-row">
      <span class="ops-lbl">비활성 시간</span>
      <span class="ops-val" style="color:${act.is_idle ? 'var(--red)' : 'var(--txt)'}">
        ${act.hours_idle != null ? act.hours_idle.toFixed(1) + 'h' : '—'}${act.is_idle ? ' ⚠️' : ''}
      </span>
    </div>
    <div class="ops-row">
      <span class="ops-lbl">마지막 게시</span>
      <span class="ops-val" style="font-size:13px">${kstFmt(lastPub)}</span>
    </div>`;
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
